openapi: 3.1.0
info:
  title: (S)AGE API
  version: 11.19.0
  description: |-
    (Sovereign) Agent Governed Experience — network REST API for memory
    submission, validation, and query.

    This machine-readable contract intentionally excludes the same-machine
    human CEREBRUM control plane under `/v1/dashboard/**`. Those routes are
    loopback-only management APIs, not remotely callable network APIs. Their
    authoritative contract is the “App-v23 CEREBRUM access-control routes”
    section of `docs/reference/rest-api.md`.
  contact:
    name: Dhillon Andrew Kannabhiran
    email: dhillon@levelupctf.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080
    description: Local development

# ---------------------------------------------------------------------------
# Security — Ed25519 signature authentication via headers
# ---------------------------------------------------------------------------
security:
  - ed25519Auth: []

components:
  # -----------------------------------------------------------------------
  # Security Schemes
  # -----------------------------------------------------------------------
  securitySchemes:
    ed25519Auth:
      type: apiKey
      in: header
      name: X-Agent-ID
      description: >-
        Ed25519 authentication is conveyed through three headers sent together:
        **X-Agent-ID** (hex-encoded public key), **X-Signature** (Ed25519
        signature of the canonical request payload), and **X-Timestamp** (unix
        epoch seconds). All three must be present on authenticated endpoints.
        Current clients should also send **X-Nonce**. After app-v17 activation,
        consensus binds delegated REST proofs to the exact canonical request,
        enforces the timestamp against block time, and consumes each proof once.

  # -----------------------------------------------------------------------
  # Parameters
  # -----------------------------------------------------------------------
  parameters:
    memoryId:
      name: memory_id
      in: path
      required: true
      description: Unique memory object identifier (UUID v7).
      schema:
        type: string
        format: uuid

  # -----------------------------------------------------------------------
  # Schemas
  # -----------------------------------------------------------------------
  schemas:
    # -- Enums -------------------------------------------------------------
    MemoryType:
      type: string
      enum:
        - fact
        - observation
        - inference
        - task
      description: Classification of the memory object.

    MemoryStatus:
      type: string
      enum:
        - proposed
        - validated
        - committed
        - challenged
        - deprecated
      description: Lifecycle state of a memory object.

    VoteDecisionEnum:
      type: string
      enum:
        - accept
        - reject
        - abstain

    # -- Core domain objects -----------------------------------------------
    KnowledgeTriple:
      type: object
      required:
        - subject
        - predicate
        - object
      properties:
        subject:
          type: string
          description: Subject entity of the triple.
        predicate:
          type: string
          description: Relationship between subject and object.
        object:
          type: string
          description: Object entity of the triple.

    MemoryRecord:
      type: object
      required:
        - memory_id
        - submitting_agent
        - content
        - content_hash
        - memory_type
        - domain_tag
        - confidence_score
        - status
        - created_at
      properties:
        memory_id:
          type: string
          format: uuid
          description: Unique identifier (UUID v7).
        submitting_agent:
          type: string
          description: Hex-encoded Ed25519 public key of the proposing agent.
        content:
          type: string
          description: Natural-language memory content.
        content_hash:
          type: string
          description: SHA-256 hash of content (hex-encoded).
        embedding:
          type: array
          items:
            type: number
            format: float
          description: 1536-dimensional embedding vector.
        embedding_hash:
          type: string
          description: SHA-256 hash of the embedding vector (hex-encoded).
        memory_type:
          $ref: "#/components/schemas/MemoryType"
        domain_tag:
          type: string
          description: Domain or topic tag for the memory.
        confidence_score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >-
            Current confidence at query time: the agent-assigned score after
            time decay and the corroboration boost are applied.
        initial_confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >-
            Stored (undecayed) confidence — the on-chain value set at submission
            (corroboration never rewrites it), before time decay. Sibling to the
            decayed confidence_score. Present for local memories; omitted (absent)
            for federated results, where only the serving peer's already-decayed
            value is available. Not guaranteed on every result.
        corroboration_count:
          type: integer
          minimum: 0
          description: >-
            Number of distinct corroborating agent IDs backing this memory — the
            multiplier behind the corroboration boost in confidence_score.
            Returned on recall paths (/v1/memory/query, /search, /hybrid) and
            the detail endpoint so readers can tell a low score caused by no
            corroboration (a fresh, untested belief) from one caused by time
            decay (a once-solid fact).
        challenge_count:
          type: integer
          minimum: 0
          description: >-
            Number of distinct challenger IDs in the off-chain lifetime audit
            projection. This is evidence history, not an open-vote count.
        evidence_counts_available:
          type: boolean
          description: >-
            True only when both count queries succeeded and no durable
            recovery/repair-incomplete marker was detected. It is not an
            attestation against out-of-band partial SQL audit-table corruption.
            When false, corroboration_count and challenge_count may still be
            reconstructed canonical lower bounds after pristine state sync or
            repair; zero is not proof that no historical evidence existed.
        challenge_round:
          type: integer
          format: int64
          minimum: 1
          description: Current app-v21 challenge round; absent when no weighted round is open.
        current_challenger_count:
          type: integer
          format: int32
          minimum: 1
          description: Distinct challengers accrued in the current open app-v21 round.
        required_challengers:
          type: integer
          format: int32
          minimum: 1
          description: Distinct challengers required to deprecate in the current app-v21 round.
        disputed:
          type: boolean
          description: >-
            True when the memory remains recallable while challenged. When true,
            confidence_score already includes the disputed confidence haircut.
        classification:
          type: integer
          minimum: 0
          maximum: 4
          description: >-
            Per-record clearance level: 0=PUBLIC, 1=INTERNAL, 2=CONFIDENTIAL,
            3=SECRET, 4=TOPSECRET.
        status:
          $ref: "#/components/schemas/MemoryStatus"
        parent_hash:
          type: string
          description: Hash of the parent memory (for lineage), if any.
        task_status:
          type: string
          description: >-
            For task-type memories: planned, in_progress, done, or dropped.
        knowledge_triples:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeTriple"
          description: Extracted knowledge graph triples.
        votes:
          type: array
          items:
            type: object
            properties:
              voter_id:
                type: string
              decision:
                $ref: "#/components/schemas/VoteDecisionEnum"
              rationale:
                type: string
              voted_at:
                type: string
                format: date-time
          description: Votes cast on this memory.
        corroborations:
          type: array
          items:
            type: object
            properties:
              agent_id:
                type: string
              evidence:
                type: string
              created_at:
                type: string
                format: date-time
          description: Corroborations supporting this memory.
        linked_memories:
          type: array
          items:
            type: object
          description: Memories linked to this one.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the memory was proposed.
        committed_at:
          type: string
          format: date-time
          description: Timestamp when the memory reached committed status.

    # -- Request bodies ----------------------------------------------------
    MemorySubmitRequest:
      type: object
      required:
        - content
        - memory_type
        - confidence_score
      allOf:
        - if:
            properties:
              memory_type:
                const: task
            required:
              - memory_type
          then: {}
          else:
            required:
              - domain_tag
      properties:
        content:
          type: string
          description: Natural-language memory content.
        memory_type:
          $ref: "#/components/schemas/MemoryType"
        domain_tag:
          type: string
          description: >-
            Exact domain or topic tag. Required except for an app-v23 task
            submitted by an active ordinary agent; that narrow omission uses
            the caller's currently committed owned home domain. Explicit
            values are never remapped.
        confidence_score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Agent-assigned confidence (0–1).
        classification:
          type: integer
          minimum: 0
          maximum: 4
          description: >-
            Per-record clearance: 0=PUBLIC, 1=INTERNAL, 2=CONFIDENTIAL,
            3=SECRET, 4=TOPSECRET. Omitting or sending 0 stores as PUBLIC.
        embedding:
          type: array
          items:
            type: number
            format: float
          description: Optional precomputed embedding vector; stored off-chain via supplementary cache.
        knowledge_triples:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeTriple"
          description: >-
            Optional knowledge graph triples. App-v23 task creation rejects
            this field because it is not part of the canonical task receipt.
        parent_hash:
          type: string
          description: Hash of a parent memory for lineage tracking.
        task_status:
          type: string
          enum:
            - planned
          description: >-
            New task memories enter consensus as planned. After app-v27 this
            field may be omitted: REST transaction construction and consensus
            proof verification both canonicalize omission to planned. Before
            app-v27, omission returns 400 Missing task status. Use the task-status
            endpoint to change it after creation.
        linked_memories:
          type: array
          items:
            type: string
          description: >-
            Related memory IDs for legacy submission paths. App-v23 task
            creation rejects this field; create links after the task receipt
            is confirmed.
        tags:
          type: array
          maxItems: 32
          items:
            type: string
          description: >-
            Optional user-defined labels, each at most 128 UTF-8 bytes. Above
            app-v20 the node trims no values: it rejects empty/padded/oversized
            tags, then sorts and deduplicates them into the signed transaction.
            For scoped domains they are also AppHash-covered canonical content
            and survive projection rebuild. Ordinary-domain tags remain
            node-local serving metadata. Queryable via `tags` on
            /v1/memory/query and /v1/memory/search.
        provider:
          type: string
          description: Stored off-chain only; not on-chain.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[!-~]+$"
          description: >-
            App-v23 tasks only. Permanent creation identity containing visible
            ASCII without spaces. When omitted, the node derives the same
            semantic key as MCP from the exact signed agent ID, resolved
            domain, and content. Reusing a key with a different canonical
            payload returns 409. Use a fresh explicit key only to intentionally
            create another occurrence with identical content and domain.

    MemoryQueryRequest:
      type: object
      required:
        - embedding
      properties:
        embedding:
          type: array
          items:
            type: number
            format: float
          description: Query embedding for similarity search.
        domain_tag:
          type: string
          description: Optional domain filter.
        provider:
          type: string
          description: Optional provider filter.
        min_confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Minimum confidence threshold.
        status_filter:
          $ref: "#/components/schemas/MemoryStatus"
        top_k:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: Number of results to return (max 100).
        cursor:
          type: string
          description: Opaque pagination cursor from a previous response.
        tags:
          type: array
          items:
            type: string
          description: >-
            Optional filter — when non-empty, restricts results to memories
            tagged with ANY of the listed values (OR semantics). Supported by
            both SQLiteStore and PostgresStore.

    MemorySearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: Full-text search query.
        domain_tag:
          type: string
          description: Optional domain filter.
        provider:
          type: string
          description: Optional provider filter.
        min_confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        status_filter:
          $ref: "#/components/schemas/MemoryStatus"
        top_k:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        tags:
          type: array
          items:
            type: string
          description: OR-filter by tag; SQLite only.

    HybridExpansion:
      type: object
      properties:
        query:
          type: string
          description: Paraphrase variant text.
        embedding:
          type: array
          items:
            type: number
            format: float
          description: Precomputed embedding for this variant.

    MemoryHybridRequest:
      type: object
      description: >-
        At least one of `query` or `embedding` is required. At most eight
        expansion entries are accepted. Under app-v23 one 8,192-candidate live
        authorization budget is shared by the primary query, every expansion,
        and every text/vector store leaf. Governed leaf or budget failures fail
        the whole request instead of returning partial fused results.
      properties:
        query:
          type: string
          description: Text query for the FTS5 arm.
        embedding:
          type: array
          items:
            type: number
            format: float
          description: Vector for the similarity arm.
        expansions:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/HybridExpansion"
          description: >-
            Up to eight paraphrase variants for multi-variant RRF recall. The
            array-length limit is applied before blank variants are skipped.
        domain_tag:
          type: string
        provider:
          type: string
        min_confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        status_filter:
          $ref: "#/components/schemas/MemoryStatus"
        top_k:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        tags:
          type: array
          items:
            type: string

    FilterInfo:
      type: object
      description: >-
        Identifies authorization filters that were applied. Before app-v23 a
        server may also emit legacy inventory counts. App-v23 omits denied/raw
        counts, and presence of this object is not proof that a row was hidden.
      properties:
        by:
          type: array
          items:
            type: string
          description: >-
            Filter identifiers applied. Values: rbac_submitting_agents,
            classification.
        total_before_filter:
          type: integer
          deprecated: true
          description: Legacy/pre-app-v23 only; omitted by app-v23.
        visible:
          type: integer
          deprecated: true
          description: Legacy/pre-app-v23 only; omitted by app-v23.
        hidden_count:
          type: integer
          deprecated: true
          description: Legacy/pre-app-v23 only; omitted by app-v23.

    MemoryQueryResponse:
      type: object
      required:
        - results
        - total_count
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/MemoryRecord"
        next_cursor:
          type: string
          description: Cursor for the next page, absent if no more results.
        total_count:
          type: integer
          description: Number of visible memories returned in this response.
        filtered:
          $ref: "#/components/schemas/FilterInfo"
        index_status:
          type: string
          enum: [complete, incomplete, unavailable]
          description: >
            Present on an EMPTY, domain-scoped semantic recall. "complete" and
            "incomplete" are available only for the exact unnarrowed local
            status_filter=committed contract; other empty query universes emit
            "unavailable" rather than certifying the wrong scope. "complete":
            the empty result is genuine local absence.
            "incomplete": the domain holds committed/challenged rows that no
            vector, or a foreign vector space, keeps recall from returning —
            empty is not proof of absence. "unavailable": the verdict could
            not be proven leak-free and scope-exact (including when the caller
            lacks full visibility, canonical projection health is not exact,
            the vector space is unknown, the query uses status/provider/tag/
            confidence/cursor/text narrowing, federation is requested, or the
            live domain is too large to settle cheaply). Never a count or list.

    MemoryLinkRequest:
      type: object
      required:
        - source_id
        - target_id
      properties:
        source_id:
          type: string
        target_id:
          type: string
        link_type:
          type: string
          default: related
          description: Relationship type; defaults to "related".

    MemoryLinkResponse:
      type: object
      properties:
        source_id:
          type: string
        target_id:
          type: string
        link_type:
          type: string

    PreValidateRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
        domain:
          type: string
        type:
          type: string
        confidence:
          type: number
          format: double

    PreValidateVote:
      type: object
      properties:
        validator:
          type: string
        decision:
          type: string
        reason:
          type: string

    PreValidateResponse:
      type: object
      properties:
        accepted:
          type: boolean
        quorum:
          type: string
          example: "3/3"
        votes:
          type: array
          items:
            $ref: "#/components/schemas/PreValidateVote"

    TaskStatusUpdateRequest:
      type: object
      required:
        - task_status
      properties:
        task_status:
          type: string
          enum:
            - in_progress
            - done
            - dropped
          description: >-
            Agent-authorized transitions. Re-planning/reopening is a local
            CEREBRUM operator action and is not accepted by this route.

    TaskStatusUpdateResponse:
      type: object
      properties:
        memory_id:
          type: string
        task_status:
          type: string

    ForgetRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional reason; defaults to "deprecated by user" if omitted.

    ForgetResponse:
      type: object
      required:
        - message
        - tx_hash
      properties:
        message:
          type: string
        tx_hash:
          type: string
        status:
          type: string
          enum: [challenged, deprecated]
          description: Durable post-commit consensus result when available.

    ReinstateRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional audit note explaining why the challenge is being withdrawn or resolved.

    ReinstateResponse:
      type: object
      required:
        - message
        - tx_hash
        - status
      properties:
        message:
          type: string
        tx_hash:
          type: string
        status:
          type: string
          enum:
            - committed

    VoteRequest:
      type: object
      required:
        - decision
      properties:
        decision:
          $ref: "#/components/schemas/VoteDecisionEnum"
        rationale:
          type: string
          description: Optional rationale for the vote.

    ChallengeRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Reason for challenging the memory.
        evidence:
          type: string
          description: Optional supporting evidence.

    CorroborateRequest:
      type: object
      properties:
        evidence:
          type: string
          description: Optional supporting evidence.

    # -- Response bodies ---------------------------------------------------
    MemorySubmitResponse:
      type: object
      required:
        - memory_id
        - tx_hash
        - status
        - committed
        - committed_height
      properties:
        memory_id:
          type: string
          format: uuid
        tx_hash:
          type: string
          description: CometBFT transaction hash (hex-encoded).
        status:
          type: string
          enum:
            - proposed
            - committed_unconfirmed
          description: >-
            Governed lifecycle status proposed after a confirmed projection,
            or committed_unconfirmed when the task transaction is on-chain but
            its exact local projection could not be confirmed.
        task_status:
          type: string
          enum:
            - planned
            - in_progress
            - done
            - dropped
          description: Current task workflow status. Replays may be terminal.
        committed:
          type: boolean
          description: >-
            True after broadcast_tx_commit proves the transaction committed.
            This does not by itself prove the serving projection is confirmed.
        committed_height:
          type: integer
          format: int64
          description: Block height at which the submission committed.
        projection_confirmed:
          type: boolean
          description: >-
            For app-v23 tasks, whether the exact task/assignee serving
            projection was confirmed. False is returned with HTTP 202.
        retryable:
          type: boolean
          description: >-
            False on committed_unconfirmed: reconcile the exact memory_id and
            do not resubmit the task.
        message:
          type: string
        idempotency_key:
          type: string
          description: >-
            Permanent explicit or server-derived task identity. Present on
            app-v23 task responses.
        idempotent_replay:
          type: boolean
          description: True when no new transaction was created for this key.
        embedding_provider:
          type: string
        embedding_queued:
          type: boolean

    VoteResponse:
      type: object
      required:
        - message
        - tx_hash
      properties:
        message:
          type: string
        tx_hash:
          type: string
          description: CometBFT transaction hash (hex-encoded).

    ChallengeResponse:
      type: object
      required:
        - message
        - tx_hash
      properties:
        message:
          type: string
        tx_hash:
          type: string
        status:
          type: string
          enum: [challenged, deprecated]
          description: Durable post-commit consensus result when available.

    CorroborateResponse:
      type: object
      required:
        - message
        - tx_hash
      properties:
        message:
          type: string
        tx_hash:
          type: string

    AgentProfile:
      type: object
      required:
        - agent_id
        - display_name
        - domains
        - poe_weight
        - vote_count
        - accuracy
        - on_chain_height
      properties:
        agent_id:
          type: string
          description: Hex-encoded Ed25519 public key.
        display_name:
          type: string
          description: Mutable display name (GUI-editable).
        domains:
          type: array
          items:
            type: string
          description: Distinct domain tags the agent has submitted memories under, ordered by participation frequency.
        role:
          type: string
          enum: [member, manager, admin]
          description: Current app-v23 local role. Present only after app-v23 activation.
        profile:
          type: string
          enum: [standard, companion, read_only, legacy_restricted]
          description: Current app-v23 named profile. Root never has an ordinary self profile.
        home_domain:
          type: string
          description: The active app-v23 agent's owned non-shared home domain, when its profile is writable.
        enrollment_status:
          type: string
          enum: [active, pending_review, inactive]
          description: Caller-only app-v23 enrollment standing. Pending and inactive identities may inspect only themselves.
        registration_status:
          type: string
          enum: [active, pending_review, inactive]
          description: Caller-only app-v23 registration standing.
        approval_required:
          type: boolean
          description: Whether local CEREBRUM review is required before memory access is available.
        clearance:
          type: integer
          minimum: 0
          maximum: 4
          description: The signed caller's own consensus clearance.
        capabilities:
          type: integer
          format: uint32
          description: The signed caller's own consensus capability mask.
        can_read:
          type: boolean
          description: Whether the caller can currently read its exact home_domain.
        can_write:
          type: boolean
          description: Whether the caller can currently write its exact home_domain.
        access_scope:
          type: string
          enum: [home_domain]
          description: Explicit scope for can_read and can_write.
        poe_weight:
          type: number
          format: double
          description: Current Proof-of-Experience weight.
        vote_count:
          type: integer
          description: Total votes cast.
        accuracy:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Global verdict-correctness EWMA — the alpha factor of the PoE quorum weight. Cold-start-blended (0.5 prior, transitions toward the real score after K_min=10 observations). Since v8.6.0 read from the authoritative on-chain vstats record.
        corr_count:
          type: integer
          format: int64
          description: "Lifetime count of votes that matched a terminal verdict (the delta corroboration factor). Read from the on-chain vstats record. (v8.6.0+)"
        domain_expertise:
          type: object
          additionalProperties:
            type: number
            format: double
          description: "Per-domain verdict-correctness EWMA (the beta factor, from vstats_domain), keyed by domain tag. Only present for domains the agent has voted in. (v8.6.0+)"
        on_chain_height:
          type: integer
          format: int64
          description: Block height at which the agent was registered on-chain (0 for legacy / unregistered).

    AgentRegisterRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Human-readable agent name.
        role:
          type: string
          description: "One of: admin, member, observer. Defaults to member."
        boot_bio:
          type: string
          description: Agent bio / system prompt description.
        provider:
          type: string
          description: MCP provider identifier (e.g., "claude-code", "cursor").
        p2p_address:
          type: string
          description: Peer-to-peer address.

    AgentUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Updated agent name. Omit to preserve the current name.
        boot_bio:
          type: string
          description: Updated agent bio. Omit to preserve the current bio.

    RegisteredAgent:
      type: object
      properties:
        agent_id:
          type: string
          description: Hex-encoded Ed25519 public key.
        name:
          type: string
        role:
          type: string
        boot_bio:
          type: string
        provider:
          type: string
        status:
          type: string
        clearance:
          type: integer
        on_chain_height:
          type: integer
          format: int64
          description: Block height where registered on-chain.
        visible_agents:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentDirectoryEntry:
      type: object
      required: [agent_id, name, registered_name, status]
      description: Minimal signed local recipient identity; contains no RBAC or memory totals.
      properties:
        agent_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        name:
          type: string
          description: Mutable display name.
        registered_name:
          type: string
          description: Immutable name sealed at first registration.
        provider:
          type: string
        status:
          type: string
          enum: [active]

    AgentLookupEntry:
      allOf:
        - $ref: "#/components/schemas/AgentDirectoryEntry"
        - type: object
          required: [match_kind]
          properties:
            match_kind:
              type: string
              enum: [exact, substring]

    ValidatorScore:
      type: object
      required:
        - validator_id
        - accuracy
        - domain_score
        - recency_score
        - corr_score
        - raw_weight
        - capped_weight
        - normalized_weight
      properties:
        validator_id:
          type: string
        accuracy:
          type: number
          format: double
        domain_score:
          type: number
          format: double
        recency_score:
          type: number
          format: double
        corr_score:
          type: number
          format: double
        raw_weight:
          type: number
          format: double
        capped_weight:
          type: number
          format: double
        normalized_weight:
          type: number
          format: double

    EpochInfo:
      type: object
      required:
        - epoch_num
        - block_height
        - scores
      properties:
        epoch_num:
          type: integer
          description: Current epoch number.
        block_height:
          type: integer
          format: int64
          description: Block height at epoch start.
        scores:
          type: array
          items:
            $ref: "#/components/schemas/ValidatorScore"

    PendingMemoriesResponse:
      type: object
      required:
        - memories
      properties:
        memories:
          type: array
          items:
            $ref: "#/components/schemas/MemoryRecord"
        next_cursor:
          type: string

    # -- Access Control -------------------------------------------------------
    AccessRequestBody:
      type: object
      required:
        - target_domain
      properties:
        target_domain:
          type: string
        justification:
          type: string
        requested_level:
          type: integer
          description: 1=read, 2=read+write. Defaults to 1.

    AccessGrantRequest:
      type: object
      required:
        - grantee_id
        - domain
      properties:
        grantee_id:
          type: string
          description: Hex agent ID of the grantee.
        domain:
          type: string
        level:
          type: integer
          description: 1=read, 2=read+write. Defaults to 1.
        expires_at:
          type: integer
          format: int64
          description: Unix timestamp; 0=permanent.
        request_id:
          type: string
          description: Links to originating access request.

    AccessRevokeRequest:
      type: object
      required:
        - grantee_id
        - domain
      properties:
        grantee_id:
          type: string
        domain:
          type: string
        reason:
          type: string

    # -- Domains ---------------------------------------------------------------
    DomainRegisterRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        parent:
          type: string

    ScopeDomain:
      type: object
      required: [name, subtree]
      properties:
        name:
          type: string
        subtree:
          type: boolean

    ScopeMember:
      type: object
      required: [validator_id, assigned_weight, joined_revision, active, pending_ballot_count, validator_removal_blocked]
      properties:
        validator_id:
          type: string
        assigned_weight:
          type: integer
          format: uint64
        joined_revision:
          type: integer
          format: uint64
        active:
          type: boolean
        pending_ballot_count:
          type: integer
          minimum: 0
          description: Pending ballots whose pinned roster includes this validator.
        validator_removal_blocked:
          type: boolean
          description: True while active scope membership or a pinned pending ballot prevents safe CometBFT validator removal.

    ScopeDrain:
      type: object
      required: [pending_ballot_count, pending_memory_ids, blocking_validator_ids]
      properties:
        pending_ballot_count:
          type: integer
          minimum: 0
        pending_memory_ids:
          type: array
          items:
            type: string
          description: Pending scoped memories in canonical memory-ID order.
        blocking_validator_ids:
          type: array
          items:
            type: string
          description: Validators blocked from CometBFT removal by this scope head or its pinned ballots.

    ScopeRecord:
      type: object
      required: [scope_id, revision, revision_hash, state, controller_validator_id, created_height, updated_height, domains, members, drain]
      properties:
        scope_id:
          type: string
          pattern: '^[^/]+$'
        revision:
          type: integer
          format: uint64
        revision_hash:
          type: string
          description: Domain-separated SHA-256 audit anchor for this revision.
        state:
          type: string
          enum: [active, paused, retired]
        controller_validator_id:
          type: string
        created_height:
          type: integer
          format: int64
        updated_height:
          type: integer
          format: int64
        domains:
          type: array
          items:
            $ref: "#/components/schemas/ScopeDomain"
        members:
          type: array
          items:
            $ref: "#/components/schemas/ScopeMember"
        drain:
          $ref: "#/components/schemas/ScopeDrain"

    ScopeListResponse:
      type: object
      required: [scopes, count]
      properties:
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ScopeRecord"
        count:
          type: integer

    ScopeActionMember:
      type: object
      required: [validator_id, assigned_weight]
      properties:
        validator_id:
          type: string
        assigned_weight:
          type: integer
          format: uint64
          minimum: 1
        joined_revision:
          type: integer
          format: uint64
          minimum: 1
          description: Required after revision 1; may be omitted for a new scope.
        active:
          type: boolean
          default: true

    ScopeActionTemplate:
      type: object
      required: [scope_id, revision, state, controller_validator_id, domains, members]
      properties:
        scope_id:
          type: string
          pattern: '^[^/]+$'
        revision:
          type: integer
          format: uint64
          minimum: 1
        state:
          type: string
          enum: [active, paused, retired]
        controller_validator_id:
          type: string
        domains:
          type: array
          minItems: 1
          items:
            type: string
        members:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ScopeActionMember"
      description: >-
        Guided app-v20 scope proposal. The server bytewise-sorts domains and
        members, defaults omitted member active flags to true, sets both
        consensus-owned heights to zero, validates ScopeRecordV1 invariants,
        and emits the canonical binary governance payload.

    # -- Governance (v8.0 payload-aware) ----------------------------------------
    GovernanceContextResponse:
      type: object
      required:
        - validator_id
        - governance_domain
        - app_v20_active
        - validator_active
        - active_validators
      properties:
        validator_id:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: This node's live CometBFT validator identity.
        governance_domain:
          type: string
          pattern: '^$|^[0-9a-f]{64}$'
          description: >-
            SHA-256 chain-binding committed at app-v20 activation. Empty while
            app-v20 is inactive.
        app_v20_active:
          type: boolean
          description: Whether the following governance mutation must include this context.
        validator_active:
          type: boolean
          description: >-
            Whether this gateway's live private-validator identity is present
            in the ABCI application's persisted validator roster.
        active_validators:
          type: array
          description: >-
            Exact AppHash-covered validator roster loaded from persisted ABCI
            state. Entries are sorted by validator_id.
          items:
            type: object
            required:
              - validator_id
              - voting_power
            properties:
              validator_id:
                type: string
                pattern: '^[0-9a-f]{64}$'
              voting_power:
                type: integer
                format: int64
                minimum: 1

    GovProposeRequest:
      type: object
      required:
        - operation
        - reason
      properties:
        validator_id:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            Copy from the immediately preceding authenticated
            GET /v1/governance/context response when app_v20_active is true.
        governance_domain:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            Copy from the immediately preceding authenticated
            GET /v1/governance/context response when app_v20_active is true.
        operation:
          type: string
          enum:
            - add_validator
            - remove_validator
            - update_power
            - domain_reassign
            - memory_domain_repair
            - sync_group_action
            - scope_action
          description: >-
            Governance operation. `memory_domain_repair` (app-v16, 2/3 quorum) is
            the domainless-forget remediation — it carries a base64 JSON
            `[{"memory_id","domain"}]` array in `payload` and backfills legacy
            memories' on-chain domain directly on proposal execution.
            `domain_reassign` (v8.0) is the
            access-control recovery primitive — it carries the target
            DomainReassign body via the `payload` field rather than the
            scalar target_* fields. `scope_action` (app-v20) accepts either
            the guided `scope` object or the legacy canonical binary
            ScopeRecordV1 `payload`; the two fields are mutually exclusive.
        target_id:
          type: string
          description: >-
            Hex-encoded validator pubkey for validator-set ops; reused as
            the proposal-keying identifier for `domain_reassign` (typically
            the dotted-path domain name). Required except when a
            `scope_action` supplies `scope.scope_id`, from which it is derived.
        target_pubkey:
          type: string
          description: Hex-encoded Ed25519 public key (required for add_validator).
        target_power:
          type: integer
          format: int64
          description: Validator power for add/update ops; ignored for domain_reassign.
        expiry_blocks:
          type: integer
          format: int64
          description: Proposal expiry in blocks (0 = chain default).
        reason:
          type: string
          description: Human-readable justification.
        payload:
          type: string
          description: >-
            Base64-encoded operation-specific payload (v8.0). For
            `domain_reassign`, the JSON-encoded body
            `{domain, new_owner_id, parent_domain, open_to_shared}` that
            the subsequent TxTypeDomainReassign execution tx must reproduce
            byte-for-byte. For legacy `scope_action` callers, the canonical
            binary ScopeRecordV1 template with zero system-owned heights.
            Mutually exclusive with `scope`; empty for validator-set ops.
        scope:
          $ref: "#/components/schemas/ScopeActionTemplate"

    GovProposeResponse:
      type: object
      required:
        - proposal_id
        - tx_hash
        - status
      properties:
        proposal_id:
          type: string
          description: >-
            Deterministic governance-engine identifier used by vote/cancel;
            intentionally distinct from tx_hash.
        tx_hash:
          type: string
          description: CometBFT transaction hash.
        status:
          type: string
          enum:
            - voting
            - executed
            - rejected
            - expired
            - cancelled
            - unknown
          description: >-
            Authoritative committed proposal status. `unknown` is used only
            when an embedded server has no local governance state store.
          example: voting

    GovVoteRequest:
      type: object
      required:
        - proposal_id
        - decision
      properties:
        validator_id:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Current app-v20 validator binding from GET /v1/governance/context.
        governance_domain:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Current app-v20 chain binding from GET /v1/governance/context.
        proposal_id:
          type: string
          description: From the propose response.
        decision:
          type: string
          enum:
            - accept
            - reject
            - abstain

    GovVoteResponse:
      type: object
      required:
        - tx_hash
        - status
      properties:
        tx_hash:
          type: string
        status:
          type: string
          example: recorded

    GovCancelRequest:
      type: object
      required:
        - proposal_id
      properties:
        validator_id:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Current app-v20 validator binding from GET /v1/governance/context.
        governance_domain:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Current app-v20 chain binding from GET /v1/governance/context.
        proposal_id:
          type: string

    GovCancelResponse:
      type: object
      required:
        - tx_hash
        - status
      properties:
        tx_hash:
          type: string
        status:
          type: string
          example: cancelled

    # -- Domain reassign (v8.0) ---------------------------------------------
    DomainReassignRequest:
      type: object
      required:
        - domain
        - new_owner_id
        - proposal_id
      properties:
        domain:
          type: string
          description: Dotted-path domain name to reassign.
        new_owner_id:
          type: string
          description: Hex(64) Ed25519 agent ID of the new owner.
        parent_domain:
          type: string
          description: >-
            Optional. Must match the existing parent or be left empty to
            preserve. Mismatched parents are rejected during FinalizeBlock.
        proposal_id:
          type: string
          description: >-
            Hex-encoded ID of the previously accepted gov_propose
            (`domain_reassign`) record. The execution tx is a no-op unless
            this proposal exists, has executed, and hasn't been consumed.
        open_to_shared:
          type: boolean
          default: false
          description: >-
            When true, also writes the on-chain `shared_domain:<name>`
            sentinel so post-fork access checks treat the domain as
            catch-all-writable.
        expected_owner_id:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
          description: >-
            App-v26 ownership compare-and-swap binding. Must be the exact
            Hex(64) current owner observed before the governance proposal was
            created; the proposal and execution transaction bind the same
            value, and consensus rejects a stale transfer if ownership changed
            before execution. Omit this field on pre-app-v26 chains.

    DomainReassignResponse:
      type: object
      required:
        - tx_hash
        - purged_grants
      properties:
        tx_hash:
          type: string
          description: CometBFT transaction hash of the executed reassignment.
        purged_grants:
          type: integer
          description: >-
            Number of grant entries cleared when the domain ownership
            flipped. The previous owner's chain-of-trust does not survive
            the reassign — operators audit this count to confirm the blast
            radius of recovery.

    # -- Orgs / Federation ---------------------------------------------------
    OrgRegisterRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string

    OrgAddMemberRequest:
      type: object
      required:
        - agent_id
      properties:
        agent_id:
          type: string
        clearance:
          type: integer
          minimum: 0
          maximum: 4
          description: Defaults to 1 (INTERNAL).
        role:
          type: string
          description: "admin, member, or observer. Defaults to member."

    OrgSetClearanceRequest:
      type: object
      required:
        - agent_id
        - clearance
      properties:
        agent_id:
          type: string
        clearance:
          type: integer
          minimum: 0
          maximum: 4

    FederationProposeRequest:
      type: object
      required:
        - target_org_id
      properties:
        target_org_id:
          type: string
        allowed_domains:
          type: array
          items:
            type: string
          description: '["*"] means all domains.'
        allowed_depts:
          type: array
          items:
            type: string
        max_clearance:
          type: integer
          minimum: 0
          maximum: 4
          description: Ceiling clearance; defaults to 2 (CONFIDENTIAL).
        expires_at:
          type: integer
          format: int64
          description: Unix timestamp; 0=permanent.
        requires_approval:
          type: boolean

    FederationRevokeRequest:
      type: object
      properties:
        reason:
          type: string

    # -- Departments ---------------------------------------------------------
    DeptRegisterRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        parent_dept:
          type: string

    DeptAddMemberRequest:
      type: object
      required:
        - agent_id
      properties:
        agent_id:
          type: string
        clearance:
          type: integer
          minimum: 0
          maximum: 4
          description: Defaults to 1.
        role:
          type: string
          description: Defaults to member.

    # -- Pipeline ------------------------------------------------------------
    PipeResolveRequest:
      type: object
      required:
        - to
      properties:
        to:
          type: string
          description: Local agent/provider name, exact agent@chain address, or visible #network/agent handle.

    PipeResolveResponse:
      type: object
      properties:
        to_agent:
          type: string
        to_provider:
          type: string
        source_chain_id:
          type: string
          description: Local chain bound into a federated send request.
        destination_chain_id:
          type: string
          description: Remote chain bound into a federated send request; empty for local targets.
        address:
          type: string
        handle:
          type: string
        display_name:
          type: string

    PipeSendRequest:
      type: object
      required:
        - payload
      properties:
        to_agent:
          type: string
          description: Target agent_id (direct). One of to_agent or to_provider required.
        to_provider:
          type: string
          description: Provider name or agent name; resolves to agent_id if unambiguous.
        source_chain_id:
          type: string
          description: Exact local chain returned by /v1/pipe/resolve for a federated target.
        destination_chain_id:
          type: string
          description: Exact remote chain returned by /v1/pipe/resolve for a federated target.
        intent:
          type: string
          description: Human description of the work.
        payload:
          type: string
          description: Arbitrary content.
        ttl_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: With idempotency_key, omitted/0 is durable until handled; without a key, omitted/0 uses the legacy 1440-minute lifetime. Values 1-1440 request explicit expiry.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 256
          description: Optional caller-scoped replay key. Exact retry returns the original row; same key with different content is a conflict.

    PipeSendResponse:
      type: object
      required: [pipe_id, status, expires_at, destination_chain_id, idempotent_replay]
      properties:
        pipe_id:
          type: string
          pattern: '^msg-'
        status:
          type: string
          example: pending
        expires_at:
          type: string
          format: date-time
        destination_chain_id:
          type: string
          description: Exact remote SAGE chain for a federated send; empty for local work.
        idempotent_replay:
          type: boolean
          description: True only when a keyed request returned its original row without another admission or wake generation.
        transport_status:
          type: string
          enum: [queued]
          description: Present only for a federated send; confirms durable local queuing, not peer receipt.
        peer_status:
          type: string
          enum: [unconfirmed]
          description: Present only for a federated send; the remote peer and agent have not yet acknowledged delivery.

    PipeResultRequest:
      type: object
      required:
        - result
      properties:
        result:
          type: string
        source_pipe_id:
          type: string
          description: Stable source event ID from GET /v1/pipe/{pipe_id}; required for federated results.
        source_chain_id:
          type: string
          description: Exact reply-source chain from GET /v1/pipe/{pipe_id}; required for federated results.
        claimant_session_id:
          type: string
          maxLength: 128
          description: Opaque session currently holding the claim; required for federated results.

    PipelineMessage:
      type: object
      properties:
        pipe_id:
          type: string
        from_agent:
          type: string
        from_provider:
          type: string
          description: Persisted provider metadata; never replaced by a friendly name.
        from_display_name:
          type: string
          description: Response-only current local display name. Presentation metadata, not authority.
        from_registered_name:
          type: string
          description: Response-only saved local registration name for current rows. Legacy rows without one use the current display-name compatibility fallback, so this field is presentation metadata rather than immutable history; exact from_agent remains authoritative.
        from_agent_provider:
          type: string
          description: Response-only current provider for the exact local from_agent; presentation fallback only.
        to_agent:
          type: string
        to_provider:
          type: string
          description: Persisted provider routing selector; never replaced by a friendly name.
        to_display_name:
          type: string
          description: Response-only current local recipient display name. Omitted for a foreign recipient.
        to_registered_name:
          type: string
          description: Response-only saved local recipient registration name for current rows. Legacy rows without one use the current display-name compatibility fallback; omitted for a foreign recipient.
        to_agent_provider:
          type: string
          description: Response-only current provider for the exact local to_agent; distinct from the persisted to_provider routing selector.
        intent:
          type: string
        payload:
          type: string
        status:
          type: string
          description: pending, claimed, completed.
        result:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        claimed_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        claimed_by:
          type: string
        replied_by:
          type: string
          description: >-
            Present on GET /v1/pipe/results only. The agent that ACTUALLY
            completed the row and therefore authored the untrusted reply
            content. It is NOT interchangeable with to_agent: an operator/admin
            may claim any local pipe and any same-provider agent may claim a
            provider-addressed one. For a federated reply landed home it equals
            to_agent, because the transport refuses a result whose remote author
            differs. Omitted when the node cannot attribute the reply; the
            addressee is never substituted for it.
        authority:
          type: string
          description: Derived response authority; "data_only" on completed reply projections.
        trust:
          type: string
          description: Derived trust label such as agent_untrusted or external_untrusted.
        security_notice:
          type: string
          description: Derived instruction-boundary notice for untrusted request/result content.
        payload_authority:
          type: string
          description: Derived authority of retained request context; "request_only" when present.
        result_authority:
          type: string
          description: Derived authority of reply content; "data_only" when present.
        journal_id:
          type: string
        source_chain_id:
          type: string
          description: Origin SAGE chain for imported work.
        source_pipe_id:
          type: string
          description: Stable origin event ID for imported work.
        destination_chain_id:
          type: string
          description: Destination SAGE chain for outbound work.
        reply_source_chain_id:
          type: string
          description: Local chain that must be bound into a federated result request.
        federation_policy_epoch:
          type: string
        federation_agreement_id:
          type: string
        federation_contact_id:
          type: string
        federation_contact_revision:
          type: string
          description: Target-specific federation authorization revision; unrelated contact changes do not invalidate exact-address queued work.
        receipt_protocol_version:
          type: integer
          enum: [2]
          description: >-
            Present only on an imported federated inbox item when both peers
            negotiated federated-pipeline-receipts-v2.

    MessageSendRequest:
      type: object
      required: [to_agent, payload, idempotency_key]
      properties:
        to_agent:
          type: string
          minLength: 1
          description: Exact active local ordinary-agent ID. Provider aliases and federated addresses are not accepted.
        payload:
          type: string
          minLength: 1
          description: Message request content, subject to the pipeline content-size limit.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 256
          description: Caller-scoped retry key. Reuse with a different exact request returns 409.
        intent:
          type: string
          description: Optional human-readable purpose, subject to the pipeline intent-size limit.
        ttl_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          default: 0
          description: Omitted/0 keeps the message durable until handled; 1-1440 requests explicit expiry.

    MessageSendResponse:
      type: object
      required: [message_id, status, idempotent_replay]
      properties:
        message_id:
          type: string
        status:
          type: string
          enum: [pending, claimed, completed, expired, failed]
        expires_at:
          type: string
          format: date-time
          description: Present only when the sender requested an explicit TTL.
        retention:
          type: string
          enum: [durable_until_handled]
        idempotent_replay:
          type: boolean

    MessageReceiveRequest:
      type: object
      required: [receive_token]
      properties:
        receive_token:
          type: string
          minLength: 1
          maxLength: 256
          description: Caller-scoped token binding one exact ordered claimed batch for response-loss replay.
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 5

    MessageItem:
      type: object
      required: [message_id, from_agent, payload, status, created_at, expires_at, authority, trust, security_notice]
      properties:
        message_id:
          type: string
        from_agent:
          type: string
        from_provider:
          type: string
          description: Persisted provider metadata; never replaced by a friendly name.
        from_display_name:
          type: string
          description: Response-only current local display name. Presentation metadata, not authority.
        from_registered_name:
          type: string
          description: Response-only saved local registration name for current rows. Legacy rows without one use the current display-name compatibility fallback, so exact from_agent remains authoritative.
        intent:
          type: string
        payload:
          type: string
          description: Untrusted request data. It never conveys tool or instruction authority.
        status:
          type: string
          const: claimed
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        authority:
          type: string
          const: request_only
        trust:
          type: string
          const: agent_untrusted
        security_notice:
          type: string

    MessageReceiveResponse:
      type: object
      required: [items, count, idempotent_replay]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MessageItem"
        count:
          type: integer
          minimum: 0
        idempotent_replay:
          type: boolean

    ClaimedElsewhereItem:
      type: object
      required: [message_id, claimant_session_id, created_at, expires_at, foreign]
      description: >-
        Passive exact-recipient recovery metadata for one still-actionable claim
        held by another runtime. Sender, provider, chain ID, intent, payload, and
        result are deliberately excluded.
      properties:
        message_id:
          type: string
        claimant_session_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Current compare-and-swap source fence for deliberate handoff.
        created_at:
          type: string
          format: date-time
        claimed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        foreign:
          type: boolean
          description: True for inbound federated compatibility work; no chain identifier is exposed.

    ClaimedElsewhereResponse:
      type: object
      required: [claimed_elsewhere_count, items, limit, truncated]
      properties:
        claimed_elsewhere_count:
          type: integer
          minimum: 0
          description: Exact current total across all pages, excluding past-TTL claims.
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ClaimedElsewhereItem"
        limit:
          type: integer
          minimum: 1
          maximum: 20
        truncated:
          type: boolean
        next_cursor:
          type: string
          description: Opaque exclusive continuation, present only when truncated is true.

    MessageReplyRequest:
      type: object
      required: [result]
      properties:
        result:
          type: string
          minLength: 1
          description: Exact reply content. The same second reply is idempotent; a different reply returns 409.

    MessageActionResponse:
      type: object
      required: [message_id, idempotent_replay]
      properties:
        message_id:
          type: string
        status:
          type: string
          enum: [completed]
        read_status:
          type: string
          enum: [confirmed]
        idempotent_replay:
          type: boolean

    MessageStatusResponse:
      type: object
      required: [message_id, scope, transport_status, read_status, workflow_status, sent_at, expires_at]
      description: Payload-free metadata returned only to the exact signed sender.
      properties:
        message_id:
          type: string
        scope:
          type: string
          const: local
        transport_status:
          type: string
          const: delivered
          description: Durable same-node inbox insertion, not evidence of presence or comprehension.
        read_status:
          type: string
          enum: [not_confirmed, confirmed]
        read_evidence:
          type: string
          const: local_exact_ack
        workflow_status:
          type: string
          enum: [pending, claimed, completed, expired, failed]
        sent_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        terminal_at:
          type: string
          format: date-time
        terminal_reason:
          type: string
          enum: [completed, expired, failed]

    FederatedPipeReceiptChallenge:
      type: object
      required:
        - version
        - message_id
        - sender_chain_id
        - recipient_chain_id
        - sender_agent_id
        - recipient_agent_id
        - content_digest
        - event_kind
        - policy_epoch
        - agreement_id
        - contact_id
        - contact_revision
      description: >-
        Payload-free immutable challenge returned only to the exact recipient
        of a negotiated receipt-v2 import. Submit it unchanged to the matching
        receipt/{kind} route so the exact recipient signs every binding.
      properties:
        version:
          type: integer
          const: 2
        message_id:
          type: string
        sender_chain_id:
          type: string
        recipient_chain_id:
          type: string
        sender_agent_id:
          type: string
        recipient_agent_id:
          type: string
        content_digest:
          type: string
        event_kind:
          type: string
          enum: [claimed, read]
        policy_epoch:
          type: string
        agreement_id:
          type: string
        contact_id:
          type: string
        contact_revision:
          type: string
        authorization_mode:
          type: string
        relation_digest:
          type: string

    FederatedPipeReceiptActionResponse:
      type: object
      required: [pipe_id, event_kind, receipt_status, idempotent_replay]
      properties:
        pipe_id:
          type: string
        event_kind:
          type: string
          enum: [claimed, read]
        receipt_status:
          type: string
          const: queued
        idempotent_replay:
          type: boolean

    FederatedPipeReceiptStatus:
      type: object
      required: [pipe_id, protocol, transport_status, claim_status, read_status]
      description: >-
        Payload-free exact-sender projection. Delivery, recipient claim/read,
        and terminal outcome are independent monotonic dimensions; timestamps
        are evidence metadata and never order authority.
      properties:
        pipe_id:
          type: string
        protocol:
          type: string
          enum: [unsupported, receipt-v2]
        transport_status:
          type: string
          enum: [pending, delivered, failed]
        delivery_evidence:
          type: string
          enum: [peer_operator_durable_admission]
        delivered_at:
          type: string
          format: date-time
        claim_status:
          type: string
          enum: [unconfirmed, confirmed]
        claimed_at:
          type: string
          format: date-time
        read_status:
          type: string
          enum: [unconfirmed, confirmed]
        read_at:
          type: string
          format: date-time
        terminal_kind:
          type: string
          enum: [failed, expired, revoked]
        terminal_at:
          type: string
          format: date-time

    PipelineDeliveryUpdate:
      type: object
      description: Payload-free, one-shot terminal delivery feedback for the local signing agent.
      properties:
        event_id:
          type: string
        pipe_id:
          type: string
        event_kind:
          type: string
          enum: [send, result]
        remote_chain_id:
          type: string
        target_agent_id:
          type: string
        state:
          type: string
          enum: [failed]
        attempts:
          type: integer
        last_error:
          type: string
          description: Peer-originated diagnostic text; clients must present it as external/untrusted.
        created_at:
          type: string
          format: date-time

    # -- Embeddings ----------------------------------------------------------
    EmbedRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string

    EmbedResponse:
      type: object
      properties:
        embedding:
          type: array
          items:
            type: number
            format: float
        model:
          type: string
        dimension:
          type: integer

    EmbedInfoResponse:
      type: object
      properties:
        semantic:
          type: boolean
          description: >-
            True when a real embedding provider is available (or vault is
            active — in that case FTS5 cannot index encrypted content).
        provider:
          type: string
          description: Active embedding provider name (e.g. ollama, hash).
        dimension:
          type: integer
        ready:
          type: boolean
        submit_embedding_authoritative:
          type: boolean
          description: >-
            True when POST /v1/memory/submit always generates the authoritative
            vector with the node's active provider. Current MCP clients use this
            capability to omit a redundant compatibility embedding; older nodes
            omit the field and continue receiving the client-generated vector.

    # -- MCP Tokens ----------------------------------------------------------
    MCPTokenIssueRequest:
      type: object
      required:
        - agent_id
      properties:
        name:
          type: string
          description: Human label, e.g. "chatgpt-laptop".
        agent_id:
          type: string
          description: >-
            App-v23: 64-char hex Ed25519 pubkey of an existing active approved
            ordinary agent whose exact key is locally managed. The bearer
            executes with that identity's existing permissions. Pre-v23: the
            node operator identity.

    MCPTokenIssueResponse:
      type: object
      properties:
        id:
          type: string
          description: Public token ID used for revocation.
        name:
          type: string
        agent_id:
          type: string
        token:
          type: string
          description: Base64url(32 random bytes). Shown ONCE — never stored in plaintext.
        created_at:
          type: string
          format: date-time
        use_hint:
          type: string

    MCPTokenSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        agent_id:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time

    HealthResponse:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          example: healthy
        version:
          type: string
          example: 11.15.0

    ReadinessResponse:
      type: object
      required:
        - status
        - postgres
        - cometbft
      properties:
        status:
          type: string
          example: ready
        postgres:
          type: boolean
        cometbft:
          type: boolean
        scoped_projection:
          type: object
          description: >-
            v11.9 canonical scoped-content projection status. When required is
            true and ok is false, readiness fails closed with HTTP 503.
          required:
            - checked
            - required
            - ok
            - records
            - rebuilt
          properties:
            checked:
              type: boolean
            required:
              type: boolean
            ok:
              type: boolean
            records:
              type: integer
            rebuilt:
              type: integer
            detail:
              type: string

    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details for HTTP APIs.
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri
          description: URI reference identifying the specific occurrence.
        reason_code:
          type: string
          description: Stable sanitized machine-readable denial reason, when available.
        remedy:
          type: string
          description: Exact operator action that can make a later request valid.
        retryable:
          type: boolean
          description: Whether automatically repeating the same request is safe.

    DomainWriteDeniedProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required:
            - reason_code
            - remedy
            - retryable
          properties:
            type:
              const: https://sage.dev/errors/domain-write-denied
            status:
              const: 403
            reason_code:
              type: string
              enum:
                - missing_write_grant
                - foreign_write_restricted
                - shared_write_restricted
                - domain_claim_restricted
                - principal_pending_review
                - no_owned_home_domain
                - manager_scope_denied
            remedy:
              type: string
            retryable:
              const: false

  # -----------------------------------------------------------------------
  # Reusable responses
  # -----------------------------------------------------------------------
  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: Missing or invalid authentication headers.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: >-
        Caller authenticated but lacks authorisation, or the request was
        rejected during on-chain finalisation (e.g. quorum-gated tx without
        an executed proposal). The `detail` field carries the upstream
        rejection reason.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Conflict (e.g. duplicate submission or already voted).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InternalError:
      description: Internal server error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ServiceUnavailable:
      description: Required node runtime capability or configuration is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotImplemented:
      description: The active node runtime does not implement this optional capability.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  # -- Memory --------------------------------------------------------------
  /v1/memory/submit:
    post:
      operationId: submitMemory
      summary: Submit a new memory for consensus validation.
      tags:
        - Memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemorySubmitRequest"
      responses:
        "200":
          description: >-
            Confirmed idempotent task replay. Returns the original
            memory_id/tx_hash/height and current task status; no new task was
            created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemorySubmitResponse"
        "202":
          description: >-
            The task transaction committed but its exact task/assignee
            projection was not confirmed. projection_confirmed and retryable
            are false; reconcile the returned memory_id and do not resubmit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemorySubmitResponse"
        "201":
          description: >-
            New memory transaction committed. For an app-v23 task the exact
            assignee projection is confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemorySubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Memory write denied. A canonical permanent denial includes the
            stable reason_code/remedy/retryable=false contract; unknown
            denials remain generic Problem Details.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/DomainWriteDeniedProblem"
                  - $ref: "#/components/schemas/ProblemDetails"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: >-
            Task assignment bridge, idempotency receipt, or current
            authorization state is unavailable. No new retry transaction is
            broadcast when the authoritative receipt cannot be verified.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/memory/query:
    post:
      operationId: queryMemories
      summary: Perform a vector similarity search over memories.
      tags:
        - Memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryQueryRequest"
      responses:
        "200":
          description: Query results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryQueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >-
            App-v23 authorization would require examining more than 8,192 raw
            candidates. Narrow the domain, provider, tag, status, or other
            filters before retrying.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/memory/search:
    post:
      operationId: searchMemories
      summary: Full-text search over memories (FTS5/BM25).
      description: >-
        Not available when vault (content encryption) is active — use
        GET /v1/embed/info to check; route to /v1/memory/query instead when
        semantic=true.
      tags:
        - Memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemorySearchRequest"
      responses:
        "200":
          description: Search results. Same shape as /v1/memory/query response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryQueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >-
            App-v23 authorization would require examining more than 8,192 raw
            candidates. Narrow the domain, provider, tag, status, or other
            filters before retrying.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/memory/hybrid:
    post:
      operationId: hybridSearchMemories
      summary: Fused FTS5 + vector search via Reciprocal Rank Fusion.
      description: >-
        At least one of `query` or `embedding` is required. Supports query
        expansions for multi-variant recall, with at most eight expansion
        entries. Under app-v23 the primary query, all expansion variants, and
        every text/vector store leaf share one 8,192-candidate live
        authorization budget. Exhausting that budget returns 422. A governed
        leaf failure fails the entire request (503 when authorization state is
        unavailable, otherwise the applicable error) and never returns a 200
        response containing partial fused results.
      tags:
        - Memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryHybridRequest"
      responses:
        "200":
          description: Hybrid search results. Same shape as /v1/memory/query response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryQueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >-
            The request contains more than eight expansion entries, or app-v23
            authorization across the primary query, all expansions, and all
            text/vector leaves would require examining more than 8,192 raw
            candidates. Reduce expansions or narrow the domain, provider, tag,
            status, or other filters before retrying.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: >-
            Live authorization state needed by a governed hybrid leaf is
            unavailable. The request fails closed; no partial fused result is
            returned.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/memory/list:
    get:
      operationId: listMemories
      summary: Paginated memory list with RBAC agent isolation.
      description: >-
        App-v23 applies live authorization before visible offset/limit. When
        has_more is true, total is an authorization-safe visible lower bound
        and total_exact is false. Once the visible stream is exhausted,
        total_exact is true and total is exact. Denied/raw counts are never
        returned. Visible offset is capped at 7,900 and one request examines at
        most 8,192 raw authorization candidates. A broader request returns 422
        Query too broad and must be narrowed.
      tags:
        - Memory
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 7900
          description: App-v23 maximum is 7,900 visible records.
        - name: domain
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: agent
          in: query
          schema:
            type: string
          description: Filter by submitting agent ID.
      responses:
        "200":
          description: Paginated list of memories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  memories:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemoryRecord"
                  total:
                    type: integer
                    description: >-
                      Visible total or authorization-safe lower bound; inspect
                      total_exact.
                  limit:
                    type: integer
                  offset:
                    type: integer
                  has_more:
                    type: boolean
                    description: Whether another currently visible row exists.
                  total_exact:
                    type: boolean
                    description: Whether total is the exact visible total.
                  filtered:
                    $ref: "#/components/schemas/FilterInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >-
            Offset exceeds 7,900 or app-v23 authorization would require
            examining more than 8,192 raw candidates. Narrow filters or page
            sequentially.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Current app-v23 record authorization state is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/memory/timeline:
    get:
      operationId: getMemoryTimeline
      summary: Memory creation counts grouped by time bucket.
      description: >-
        Before app-v23, the historical no-domain aggregate is global. App-v23
        treats aggregate existence/timing as governed metadata: it walks stable
        bounded memory pages across the requested range, applies central live
        record disclosure to every row, and counts only currently visible
        records. RFC3339 bounds are limited to 31 days and 8,192 raw
        candidates per request; overly wide/dense requests return 422.
        Authorization-state failure returns 503. Bucket period strings preserve
        the backend's historical SQLite or PostgreSQL representation.
      tags:
        - Memory
      parameters:
        - name: domain
          in: query
          schema:
            type: string
        - name: bucket
          in: query
          schema:
            type: string
            default: hour
          description: Time bucket size.
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Start time (RFC3339). Defaults to now-24h.
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: End time (RFC3339). Defaults to now.
      responses:
        "200":
          description: Timeline buckets.
          content:
            application/json:
              schema:
                type: object
                required: [buckets, total]
                properties:
                  buckets:
                    type: array
                    items:
                      type: object
                      required: [period, count]
                      properties:
                        period:
                          type: string
                        count:
                          type: integer
                        domain:
                          type: string
                  total:
                    type: integer
                    description: Sum of the currently visible bucket counts.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          description: Invalid or reversed RFC3339 timeline range.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Timeline range or governed candidate set is too large.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Current app-v23 record authorization state is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/memory/tasks:
    get:
      operationId: getOpenTasks
      summary: Open task memories (type=task, status != done/dropped).
      description: >-
        Returns at most 500 open tasks whose assignee exactly matches the
        authenticated agent and which also pass current live domain/group/grant
        and classification authority. Unassigned and differently assigned work
        is never returned. total is the visible count. Current-generation Admin
        use is localhost-only; Root/history/stale identities are denied. Manager
        group Modify authority never widens exact task assignment. App-v23
        examines at most 8,192 raw authorization candidates; broader requests
        return 422 and must be narrowed by domain or provider.
      tags:
        - Memory
      parameters:
        - name: domain
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Open tasks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        memory_id:
                          type: string
                        content:
                          type: string
                        domain_tag:
                          type: string
                        task_status:
                          type: string
                        assignee:
                          type: string
                        task_picked_up_by:
                          type: string
                        task_picked_up_at:
                          type: string
                          format: date-time
                        confidence_score:
                          type: number
                          format: double
                        created_at:
                          type: string
                  total:
                    type: integer
                    description: Number of visible exact-assignee tasks returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: App-v23 caller is not an active ordinary agent.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: >-
            App-v23 authorization would require examining more than 8,192 raw
            task candidates. Narrow the domain or provider filter.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: App-v23 local policy state is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/memory/link:
    post:
      operationId: linkMemories
      summary: Link two memories with a relationship type (off-chain, no tx).
      tags:
        - Memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryLinkRequest"
      responses:
        "200":
          description: Link created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryLinkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/memory/pre-validate:
    post:
      operationId: preValidateMemory
      summary: Dry-run the per-node validation checks without submitting on-chain.
      tags:
        - Memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreValidateRequest"
      responses:
        "200":
          description: Per-validator decisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreValidateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Pre-validation not configured on this node.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/memory/{memory_id}:
    get:
      operationId: getMemory
      summary: Retrieve a single memory by ID.
      description: >-
        App-v23 applies the same live enrollment, legacy-envelope,
        domain/group/grant, and clearance decision as recall/list. Authorship
        is provenance, not a read bypass.
      tags:
        - Memory
      parameters:
        - $ref: "#/components/parameters/memoryId"
      responses:
        "200":
          description: Full memory record with votes and corroborations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Current app-v23 record authorization state is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/memory/{memory_id}/vote:
    post:
      operationId: voteOnMemory
      summary: Authorize this node's local validator to vote on a proposed memory.
      description: >-
        Deliberate local operator override for this node's single validator
        vote; this is not an ordinary agent vote. Before app-v23 the caller
        must be the configured governance operator. Under app-v23 the caller
        must be the current CEREBRUM Root or a current local Admin and connect
        through localhost. The node must have its live validator signing key.
      tags:
        - Memory
      parameters:
        - $ref: "#/components/parameters/memoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteRequest"
      responses:
        "200":
          description: Vote recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/memory/{memory_id}/challenge:
    post:
      operationId: challengeMemory
      summary: Challenge an existing committed memory.
      tags:
        - Memory
      parameters:
        - $ref: "#/components/parameters/memoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeRequest"
      responses:
        "200":
          description: Challenge submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/memory/{memory_id}/forget:
    post:
      operationId: forgetMemory
      summary: Semantic alias for challenge — submits a TxTypeMemoryChallenge with reason "deprecated by user".
      tags:
        - Memory
      parameters:
        - $ref: "#/components/parameters/memoryId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgetRequest"
      responses:
        "200":
          description: Memory forgotten.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/memory/{memory_id}/reinstate:
    post:
      operationId: reinstateMemory
      summary: Return an open challenged memory to committed.
      description: >-
        Under app-v21, only an identity in the challenge round's snapshotted
        electorate may reinstate; later grant churn does not change eligibility.
        Legacy app-v17 challenges retain their original authorization rules.
      tags:
        - Memory
      parameters:
        - $ref: "#/components/parameters/memoryId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReinstateRequest"
      responses:
        "200":
          description: Memory reinstated after consensus commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReinstateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/memory/{memory_id}/corroborate:
    post:
      operationId: corroborateMemory
      summary: Corroborate an existing memory with supporting evidence.
      tags:
        - Memory
      parameters:
        - $ref: "#/components/parameters/memoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorroborateRequest"
      responses:
        "200":
          description: Corroboration recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorroborateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/memory/{memory_id}/task-status:
    put:
      operationId: updateTaskStatus
      summary: Start or finish an owned task (off-chain only, no tx).
      description: >-
        Requires an active signed agent that is already the task's exact
        assignee and still has current domain write plus classification/read
        authority. in_progress starts an assigned open task; unassigned work
        requires local CEREBRUM handoff. done or dropped also requires the exact
        assignee. Agents cannot set planned or reopen terminal work. Current
        Admin use is localhost-only; Root/history/stale identities are denied,
        and Manager group Modify does not widen assignment.
      tags:
        - Memory
      parameters:
        - $ref: "#/components/parameters/memoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskStatusUpdateRequest"
      responses:
        "200":
          description: Task status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusUpdateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Task is terminal or not currently assigned to this exact agent.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -- Agent ---------------------------------------------------------------
  /v1/agents:
    get:
      operationId: listRegisteredAgents
      summary: List agents visible to the authenticated caller.
      description: >-
        Requires an Ed25519-signed request. After app-v23 activation the
        response contains only active ordinary agents within the caller's
        enforced discovery boundary; pending, inactive, Root, and inconsistent
        identities are omitted.
      tags:
        - Agent
      responses:
        "200":
          description: Caller-scoped list of active ordinary agents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/RegisteredAgent"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/agents/directory:
    get:
      operationId: listAgentDirectory
      summary: List minimal local recipient identities.
      description: >-
        Signed active-ordinary local directory used by sage_directory. Root,
        historical Root, pending, inactive, removed, retired, and canonically
        inconsistent identities are omitted. This endpoint provides no online,
        reachability, delivery, or read evidence and never returns RBAC or
        memory-count fields. The database projection is capped at 100 returned
        active recipients; truncated=true directs callers to the bounded name
        lookup for recipients outside that picker window.
      tags: [Agent]
      responses:
        "200":
          description: Minimal active local recipient directory.
          content:
            application/json:
              schema:
                type: object
                required: [agents, total, truncated]
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentDirectoryEntry"
                  total:
                    type: integer
                    minimum: 0
                  truncated:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/InternalError"

  /v1/agents/lookup:
    get:
      operationId: lookupAgentsByName
      summary: Resolve a bounded local recipient name.
      description: >-
        Signed literal substring lookup across active ordinary agents' display
        name, immutable registered name, and provider. Exact field matches rank
        before substring matches. It is recipient discovery, not presence.
      tags: [Agent]
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
      responses:
        "200":
          description: Ranked bounded local recipient matches.
          content:
            application/json:
              schema:
                type: object
                required: [agents, total]
                properties:
                  agents:
                    type: array
                    maxItems: 20
                    items:
                      $ref: "#/components/schemas/AgentLookupEntry"
                  total:
                    type: integer
                    minimum: 0
                    maximum: 20
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/InternalError"

  /v1/agent/me:
    get:
      operationId: getAgentProfile
      summary: Retrieve the authenticated agent's profile.
      description: >-
        After app-v23 activation this signed self-scoped route is available to
        a registered ordinary agent, including pending_review and inactive
        callers, and exposes only that caller's role, policy, capability mask,
        and home-domain access standing. It does not reopen the active-only
        signed agent roster. CEREBRUM Root has no ordinary agent profile.
      tags:
        - Agent
      parameters:
        - in: query
          name: view
          required: false
          schema:
            type: string
            enum: [standing]
          description: Return only authenticated consensus standing, skipping optional SQL domain-history and PoE projections.
      responses:
        "200":
          description: Agent profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The signed key is unregistered or is CEREBRUM Root rather than an ordinary agent.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: App-v23 local policy state is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/agent/me/domains:
    get:
      operationId: getAgentReadableDomains
      summary: Retrieve bounded readable domains for the authenticated agent.
      description: >-
        Returns only current caller-authorized domain identifiers derived from
        the caller's own home/provenance, direct grants, and local Access
        Groups. Candidates are re-authorized against live policy. The result is
        bounded and may be truncated; it is not a global domain roster or a
        complete expansion of read-all/ancestor authority.
      tags:
        - Agent
      responses:
        "200":
          description: Bounded caller-readable domain sample.
          content:
            application/json:
              schema:
                type: object
                required: [domains, owned_domains, readable_domains, writable_domains, truncated, scope]
                properties:
                  domains:
                    type: array
                    maxItems: 64
                    items:
                      type: string
                  owned_domains:
                    description: Bounded ownership sample. Use /v1/agent/me/domains/owned for the authoritative paged set.
                    type: array
                    maxItems: 64
                    items: {type: string}
                  readable_domains:
                    description: Bounded current-policy sample suitable for choosing an exact recall scope.
                    type: array
                    maxItems: 64
                    items: {type: string}
                  writable_domains:
                    description: Bounded current-policy sample suitable for choosing an exact write scope.
                    type: array
                    maxItems: 64
                    items: {type: string}
                  truncated:
                    type: boolean
                  scope:
                    type: string
                    enum: [bounded_policy_and_provenance]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/InternalError"

  /v1/agent/me/domains/owned:
    get:
      operationId: getAgentOwnedDomains
      summary: Page through domains currently owned by the authenticated agent.
      description: >-
        Caller-only authoritative ownership projection backed by the
        consensus-maintained app-v26 owner index. It does not scan memories or
        enumerate a global domain roster. Pass next_cursor back as cursor until
        has_more is false.
      tags: [Agent]
      parameters:
        - in: query
          name: cursor
          required: false
          schema: {type: string, maxLength: 512}
        - in: query
          name: limit
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: One stable lexicographic page of currently owned domains.
          content:
            application/json:
              schema:
                type: object
                required: [domains, has_more, scope]
                properties:
                  domains:
                    type: array
                    maxItems: 100
                    items: {type: string}
                  next_cursor: {type: string}
                  has_more: {type: boolean}
                  scope:
                    type: string
                    enum: [authoritative_current_owner]
        "400": {description: Invalid cursor or limit.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/InternalError"}

  /v1/agent/register:
    post:
      operationId: registerAgent
      summary: Register an agent on-chain via CometBFT consensus.
      description: >-
        Idempotent — returns existing record (HTTP 200) if agent is already
        registered. Returns HTTP 201 for new registrations.
      tags:
        - Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRegisterRequest"
      responses:
        "201":
          description: Agent registered (new registration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredAgent"
        "200":
          description: Agent already registered (idempotent response).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredAgent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/agent/update:
    put:
      operationId: updateAgent
      summary: Update the authenticated agent's name and bio.
      description: >-
        Self-update only — agents can only modify their own metadata. Omitted
        name or boot_bio fields preserve their current canonical values.
      tags:
        - Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdateRequest"
      responses:
        "200":
          description: Agent updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    example: updated
                  tx_hash:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/agent/{id}:
    get:
      operationId: getRegisteredAgent
      summary: Get a registered agent by ID.
      tags:
        - Agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Agent's hex-encoded Ed25519 public key.
      responses:
        "200":
          description: Agent record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredAgent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -- Validator -----------------------------------------------------------
  /v1/validator/pending:
    get:
      operationId: getPendingMemories
      summary: List memories awaiting validator votes.
      description: >-
        App-v23 applies live record authorization before returning pending
        candidates and examines at most 8,192 raw candidates per request. A
        broader request returns 422 and must be narrowed by domain.
      tags:
        - Validator
      parameters:
        - name: domain_tag
          in: query
          required: false
          schema:
            type: string
          description: Filter by domain tag.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Maximum number of results.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque pagination cursor.
      responses:
        "200":
          description: Pending memories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingMemoriesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >-
            App-v23 authorization would require examining more than 8,192 raw
            pending candidates. Narrow the domain filter.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/validator/epoch:
    get:
      operationId: getEpochInfo
      summary: Retrieve current epoch information and validator scores.
      tags:
        - Validator
      responses:
        "200":
          description: Epoch info with per-validator PoE scores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpochInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # -- Access Control -------------------------------------------------------
  /v1/access/request:
    post:
      operationId: accessRequest
      summary: Request read or read+write access to a domain.
      tags:
        - Access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRequestBody"
      responses:
        "201":
          description: Access request submitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: pending
                  tx_hash:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/access/grant:
    post:
      operationId: accessGrant
      summary: Grant domain access. Caller must own the domain or be admin.
      tags:
        - Access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessGrantRequest"
      responses:
        "201":
          description: Access granted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: granted
                  tx_hash:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/access/revoke:
    post:
      operationId: accessRevoke
      summary: Revoke domain access.
      tags:
        - Access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRevokeRequest"
      responses:
        "200":
          description: Access revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: revoked
                  tx_hash:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

