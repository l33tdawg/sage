  # -- Governance ---------------------------------------------------------
  /v1/governance/context:
    get:
      operationId: getGovernanceContext
      summary: Read this node's validator-and-chain authorization binding.
      description: >-
        The configured governance operator calls this immediately before each
        mutation. When app_v20_active is true, copy both returned identifiers
        into the mutation body so the Ed25519 request signature binds the
        delegated action to this exact validator and chain. A 409 from the
        mutation means the context changed; fetch it again and re-sign. The
        same response reports whether this gateway remains active and the exact
        persisted ABCI validator roster, so restart readiness can be compared
        with CometBFT's effective validator set.
      tags:
        - Governance
      responses:
        "200":
          description: Current governance authorization context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceContextResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/governance/propose:
    post:
      operationId: proposeGovernance
      summary: Ask this node's validator to submit a governance proposal.
      description: >-
        Requires the configured governance-operator request signer and the
        node's live CometBFT private-validator key. After app-v20, every
        delegated proposal includes the fresh validator-and-chain context and
        consensus binds the exact operator-signed request (including the
        8-byte X-Nonce) as global-admin authorization. The outer validator
        remains proposer, automatic voter, and proposal-ID actor.
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovProposeRequest"
      responses:
        "200":
          description: >-
            Transaction committed. The returned status is the committed
            governance-engine state and may already be terminal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovProposeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/governance/vote:
    post:
      operationId: voteGovernance
      summary: Ask this node's local validator to vote on a governance proposal.
      description: >-
        Only the configured governance operator can authorize the gateway.
        The HTTP signer receives no voting power; the outer live validator key
        is the sole on-chain voter. After app-v20 the signed body must carry
        fresh validator/chain context. The node-local operator need not be a
        global admin.
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovVoteRequest"
      responses:
        "200":
          description: Vote recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovVoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/governance/cancel:
    post:
      operationId: cancelGovernance
      summary: Ask the proposing local validator to cancel a pending proposal.
      description: >-
        Requires the configured governance operator and live validator key.
        Consensus attributes cancellation to the outer validator proposer.
        After app-v20 the signed body must carry fresh validator/chain context;
        the node-local operator need not be a global admin.
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovCancelRequest"
      responses:
        "200":
          description: Proposal cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovCancelResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/scopes:
    get:
      operationId: listScopes
      summary: List canonical v11.9 quorum scopes and removal drain state (operator/admin only).
      tags:
        - Governance
      responses:
