  # -- Embeddings ---------------------------------------------------------
  /v1/embed:
    post:
      operationId: generateEmbedding
      summary: Generate a vector embedding via the node's local provider.
      description: >-
        Ed25519 authentication is required. After app-v23 activation the
        signer must also be an active approved local Member, Manager, or
        current-generation Admin. Admin use remains localhost-only; Root
        credentials, pending/inactive agents, and unknown keys are denied.
      tags:
        - Embeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedRequest"
      responses:
        "200":
          description: Embedding generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Embedder not ready.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/embed/personal:
    post:
      operationId: generatePersonalEmbedding
      summary: Compatibility alias for POST /v1/embed.
      description: >-
        Uses the exact same request, response, Ed25519 authentication, and
        app-v23 active local-agent authorization as POST /v1/embed.
      tags:
        - Embeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedRequest"
      responses:
        "200":
          description: Embedding generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Embedder not ready.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/embed/info:
    get:
      operationId: getEmbedInfo
      summary: Report the active embedding provider's capabilities.
      description: >-
        Clients use this to decide between vector query and FTS5 search paths.
        When vault (at-rest encryption) is active, semantic is forced true even
        if no embedder is configured. After app-v23 activation the signer must
        be an active approved local agent under the same authorization boundary
        as POST /v1/embed.
      tags:
        - Embeddings
      responses:
        "200":
          description: Embedding provider info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedInfoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # -- MCP Tokens ---------------------------------------------------------
  /v1/mcp/tokens:
    post:
      operationId: issueMCPToken
      summary: Issue a bearer token for MCP clients that cannot sign Ed25519 requests.
      description: >-
        Ed25519 auth required (current Root/Admin under app-v23). Token
        plaintext is shown ONCE; only its SHA-256 digest is persisted. App-v23
        binds the bearer to the requested existing active locally managed agent
        and never creates a new pending principal.
      tags:
        - MCP Tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPTokenIssueRequest"
      responses:
        "201":
          description: Token issued. Save the token value — it is never shown again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTokenIssueResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: MCP tokens not supported on this backend.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    get:
      operationId: listMCPTokens
      summary: List issued tokens as summaries (no token values returned).
      tags:
        - MCP Tokens
      responses:
        "200":
          description: Token summaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/MCPTokenSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: MCP tokens not supported on this backend.

  /v1/mcp/tokens/{id}:
    delete:
      operationId: revokeMCPToken
      summary: Revoke a token by ID. Idempotent.
      tags:
        - MCP Tokens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Token UUID.
      responses:
        "204":
          description: Token revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # -- Canonical local Messages ------------------------------------------
  /v1/messages:
    post:
      operationId: messageSend
      summary: Send one idempotent same-node message to an exact local agent.
      description: >-
        Uses the existing encrypted pipeline inbox. A new durable insert is
        locally delivered; an exact caller/key/request retry returns the
        original message. This route never accepts federated targets and
        requires a fresh nonce-bound signature from the exact sender.
      tags: [Messages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageSendRequest"
      responses:
        "201":
          description: New local message durably inserted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSendResponse"
        "200":
          description: Exact idempotent replay of the original send.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSendResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Message payload or intent exceeds the pipeline size limit.
        "429":
          description: Per-agent or node-wide open-message quota reached; response includes Retry-After.
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/messages/receive:
    post:
      operationId: messagesReceive
      summary: Claim or exactly replay one recipient-bound ordered message batch.
      description: >-
        Requires a fresh nonce-bound signature from the exact recipient. The
        receive token persists the ordered batch, so retry after a lost
        response never consumes later messages. Replay metadata is retained
        for 48 hours and capped at 4096 tokens per agent.
      tags: [Messages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageReceiveRequest"
      responses:
        "200":
          description: Claimed batch or exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageReceiveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: The exact replay batch was purged or is incomplete; no later work was claimed.
        "429":
          description: The per-agent receive-token metadata quota is full.
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/messages/claimed-elsewhere:
    get:
      operationId: messagesClaimedElsewhere
      summary: Passively page unfinished claims held by another claimant session.
      description: >-
        Requires a fresh nonce-bound signature from the exact recipient and this
        runtime's opaque claimant session. The read is passive and exposes only
        the metadata required for a later compare-and-swap handoff. It never
        claims, acknowledges, refreshes, hands off, completes, or decrypts work.
      tags: [Messages]
      parameters:
        - name: claimant_session_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque next_cursor copied exactly from the preceding page.
      responses:
        "200":
          description: Exact total plus an oldest-first payload-free recovery page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimedElsewhereResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/messages/{message_id}/reply:
    post:
      operationId: messageReply
      summary: Complete a fetched local message as its exact recipient.
      description: >-
        Requires a fresh nonce-bound signature. Only the recipient to which a
        canonical receive batch returned this message may reply.
      tags: [Messages]
      parameters:
        - name: message_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageReplyRequest"
      responses:
        "200":
          description: Reply persisted; an exact repeat is idempotent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Reply exceeds the pipeline result-size limit.

  /v1/messages/{message_id}/read:
    put:
      operationId: messageMarkRead
      summary: Persist exact-recipient read evidence after canonical receive.
      description: >-
        Requires a fresh nonce-bound signature. Read means only that the exact
        recipient fetched and acknowledged this row; it is not evidence of
        comprehension or action.
      tags: [Messages]
      parameters:
        - name: message_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Read acknowledgement persisted or replayed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/messages/read-batch:
    put:
      operationId: messagesMarkReadBatch
      summary: Persist exact-recipient read evidence for up to 20 fetched local messages.
      description: >-
        Transport aggregation for canonical read acknowledgements. The fresh
        nonce-bound outer request is signed by the exact recipient; each item
        is authorized independently and returns confirmed or a generic
        per-item failure. One failure never rolls back or hides independent
        successes. Repeating the exact batch is idempotent.
      tags: [Messages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_ids]
              properties:
                message_ids:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {type: string, minLength: 1}
      responses:
        "200":
          description: Per-message acknowledgement outcomes in request order.
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  count: {type: integer, minimum: 1, maximum: 20}
                  items:
                    type: array
                    minItems: 1
                    maxItems: 20
                    items:
                      type: object
                      required: [message_id, read_status]
                      properties:
                        message_id: {type: string}
                        read_status: {type: string, enum: [confirmed, not_confirmed]}
                        idempotent_replay: {type: boolean}
                        error: {type: string, enum: [invalid_message_id, duplicate_message_id, not_found]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  /v1/messages/{message_id}/status:
    get:
      operationId: messageStatus
      summary: Read payload-free local receipt/workflow metadata as the exact sender.
      description: >-
        Requires a fresh nonce-bound signature from the exact sender. Unrelated
        callers and absent IDs share the same generic 404 response. This response
        never includes request payload, reply content, or proof bytes.
      tags: [Messages]
      parameters:
        - name: message_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exact sender-only metadata projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # -- Pipeline -----------------------------------------------------------
  /v1/pipe/resolve:
    post:
      operationId: pipeResolve
      summary: Resolve a local name or visible federated handle to exact signed send fields.
      tags:
        - Pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipeResolveRequest"
      responses:
        "200":
          description: Exact local or federated pipeline target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipeResolveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/pipe/send:
    post:
      operationId: pipeSend
      summary: Send a pipeline message to another agent or provider.
      tags:
        - Pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipeSendRequest"
      responses:
        "200":
          description: Exact idempotent replay of the original pipeline message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipeSendResponse"
        "201":
          description: Pipeline message queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipeSendResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /v1/pipe/inbox:
    get:
      operationId: pipeInbox
      summary: Fetch pending messages for the authenticated agent. Auto-claims all returned items.
      tags:
        - Pipeline
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
        - name: claimant_session_id
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 128
          description: Required to atomically session-fence inbound foreign claims; local-only inbox reads may omit it.
      responses:
        "200":
          description: Inbox items.
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PipelineMessage"
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/pipe/history/inbox:
    get:
      operationId: pipeInboxHistory
      summary: Browse retained received pipeline messages without claiming them.
      tags:
        - Pipeline
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Passive retained inbox history.
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PipelineMessage"
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/pipe/history/outbox:
    get:
      operationId: pipeOutbox
      summary: Browse retained messages sent by the authenticated agent without changing state.
      tags:
        - Pipeline
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Passive retained outbox history; not a federated delivery/read receipt.
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PipelineMessage"
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/pipe/updates:
    get:
      operationId: pipeDeliveryUpdates
      summary: Atomically claim terminal federated delivery notices for the authenticated local agent.
      tags:
        - Pipeline
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        "200":
          description: Payload-free failed send/result notices. Returned notices are marked reported.
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PipelineDeliveryUpdate"
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/pipe/results:
    get:
      operationId: pipeResults
      summary: Replies to messages the authenticated agent sent (sender-exact).
      description: >-
        The sender-exact reply projection. Authorization is exact original
        sender equality, not the pipe-view rule: the recipient that wrote the
        reply, an agent sharing the message to_provider, an unrelated agent, an
        operator/admin all receive an empty list rather than a 403 that would
        confirm existence when they are authenticated ordinary callers admitted
        by the agent API boundary. An unauthenticated caller is rejected with
        401 before this handler runs. A federated reply that
        landed home is returned and labelled external_untrusted; an imported
        foreign work row whose from_agent collides with a local agent id is not.

        The returned row carries its retained intent but NOT its original
        request payload: payload is always empty on this surface (the key is
        present because PipelineMessage does not use omitempty).
        payload_authority "request_only" therefore labels the retained intent
        only, while authority and result_authority are "data_only". Every reply
        is untrusted agent-supplied data.

        replied_by names the agent that ACTUALLY wrote the reply and is not
        interchangeable with to_agent: callerCanClaimPipe admits an
        operator/admin on any local pipe and any same-provider agent on a
        provider-addressed one, so the addressee is not necessarily the author.
        Attribute reply content to replied_by. Claim timing (claimed_at) is not
        returned; it is workflow detail, not provenance.

        Passive and replay-safe in every mode: it claims nothing, acknowledges
        nothing, re-queues nothing, and two identical reads return identical
        bodies, so a retry after a lost response is safe.
      tags:
        - Pipeline
      parameters:
        - name: limit
          in: query
          description: >-
            Page size, newest first by completed_at. Out-of-range or
            unparseable values fall back to the default rather than widening
            the page. Ignored when count_only=1.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
        - name: before
          in: query
          description: >-
            v11.18.2 backward KEYSET cursor, "<RFC3339>|<pipe_id>". Echo the
            previous page's next_before verbatim to walk backward through the
            entire archive; without it the reachable set would be exactly the
            newest `limit` rows for all time. Both halves are required for
            correct paging: completed_at is written by
            strftime('%Y-%m-%dT%H:%M:%fZ') at millisecond resolution and is not
            unique, so a timestamp-only bound silently drops every reply sharing
            the boundary millisecond, including rows the previous page never
            returned. Rows are ordered by (completed_at DESC, pipe_id DESC) and
            the pager resumes with
            completed_at < ? OR (completed_at = ? AND pipe_id < ?).
            A bare RFC3339 timestamp is still accepted and means "strictly older
            than this instant" - a coarse filter that excludes ties, not a pager
            cursor. A bare sub-millisecond instant is preserved as a strict time
            bound; a composite cursor must use exact millisecond precision,
            matching every server-generated cursor. An unparseable timestamp
            half or a sub-millisecond composite cursor is a 400. Requires the optional
            store.PipelineReplyPager; a backend without it answers 501 rather
            than pretending nothing older exists. The cursor is client-held and
            the server records nothing, so paging stays passive and replay-safe.
          schema:
            type: string
          example: "2026-08-08T00:05:00Z|msg-aaaa1111"
        - name: count_only
          in: query
          description: >-
            Additive v11.18.2 payload-free probe. When set to "1" the response
            is a scalar {count, retained, newest_completed_at} instead of a
            page: no items array, no reply text, no intent, no message
            identifiers. count is the CURRENT RETAINED TOTAL, not an unread
            counter. Canonical msg-* replies are durable, while deprecated
            pipe-* compatibility results may age out, so the value is neither
            pending work nor universally monotonic. Any other value serves the
            normal projection.
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: >-
            Replies to messages this agent sent. Normal mode returns {items,
            count} with items always an array (never null) and every item
            payload-free. count_only=1 returns the scalar probe only.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: PipeResultsPage
                    required: [items, count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/PipelineMessage"
                      count:
                        type: integer
                      next_before:
                        type: string
                        description: >-
                          Composite keyset cursor "<completed_at>|<pipe_id>"
                          that resumes exactly after this page's last row. Echo
                          it as the next request's `before`. Present on every
                          non-empty page; absent when items is empty. Do not
                          rebuild a cursor from completed_at alone - it is only
                          millisecond-resolution and not unique, so a
                          timestamp-only cursor strands every reply sharing that
                          millisecond.
                  - type: object
                    title: PipeResultsCountProbe
                    required: [count, retained]
                    properties:
                      count:
                        type: integer
                        description: >-
                          Current retained total of replies for this exact
                          sender. Not an unread count or work queue; deprecated
                          compatibility results may age out.
                      retained:
                        type: boolean
                        description: count > 0.
                      newest_completed_at:
                        type: string
                        format: date-time
                        description: >-
                          completed_at of the newest retained reply, as of this
                          response. Omitted when count is 0. Pass a recorded value
                          as `since` to poll with no server-held read state. The
                          boundary is inclusive so a reply landing later in the
                          same millisecond cannot be hidden; boundary replies may
                          repeat and clients should deduplicate by message id.
        "400":
          description: >-
            The `before` cursor's timestamp half is not RFC3339, or a composite
            cursor uses a sub-millisecond timestamp that cannot name an exact
            stored row. Rejected loudly rather than silently re-serving the
            newest page, which would look like "nothing older exists".
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          description: >-
            The active store backend does not support the sender-side reply
            projection, or (for count_only=1) the payload-free counter, or (for
            before=) the backward pager. PostgresStore stubs
            GetCompletedForSender today. This is a capability gap and must never
            be rendered as "you have no replies" or "there is nothing older".
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: >-
            The node content vault is locked and replies are encrypted at rest.
            The read is passive and safe to repeat once the vault is unlocked.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/pipe/{pipe_id}:
    get:
      operationId: pipeStatus
      summary: Inspect the current local workflow row for a pipeline message.
      description: >-
        This is local queue/workflow state, not proof of remote delivery or
        reading. Canonical same-node sender/read evidence is available through
        /v1/messages. App-v26 peers may separately negotiate generation-bound
        receipt v2; this workflow route never substitutes for that evidence.
      tags:
        - Pipeline
      parameters:
        - name: pipe_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Local pipeline workflow row; not a delivery/read receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/pipe/receipts/challenge-batch:
    post:
      operationId: pipeReceiptChallengeBatch
      summary: Fetch up to 40 exact receipt-v2 challenge bodies in one local request.
      description: >-
        Accepts at most 20 imported messages with claimed/read events. Every
        challenge remains an independent immutable exact-event body and each
        item returns ready or a generic rejection. This route does not claim,
        read, or expose message content.
      tags: [Pipeline]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 40
                  items:
                    type: object
                    required: [pipe_id, kind]
                    properties:
                      pipe_id: {type: string, minLength: 1}
                      kind: {type: string, enum: [claimed, read]}
      responses:
        "200":
          description: Per-event challenge outcomes in request order.
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  count: {type: integer, minimum: 1, maximum: 40}
                  items:
                    type: array
                    minItems: 1
                    maxItems: 40
                    items:
                      type: object
                      required: [pipe_id, event_kind, status]
                      properties:
                        pipe_id: {type: string}
                        event_kind: {type: string, enum: [claimed, read]}
                        status: {type: string, enum: [ready, rejected]}
                        challenge: {$ref: "#/components/schemas/FederatedPipeReceiptChallenge"}
                        error: {type: string, enum: [invalid_receipt_event, duplicate_receipt_event, not_found]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  /v1/pipe/{pipe_id}/receipt/challenge/{kind}:
    get:
      operationId: pipeReceiptChallenge
      summary: Fetch the exact immutable receipt-v2 body an imported-message recipient must sign.
      description: >-
        The challenge contains no message content. It is available only for a
        negotiated v2 import, the exact addressed recipient, an allowed kind,
        and a currently valid federation generation.
      tags: [Pipeline]
      parameters:
        - name: pipe_id
          in: path
          required: true
          schema:
            type: string
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [claimed, read]
      responses:
        "200":
          description: Exact payload-free challenge.
          content:
            application/json:
              schema:
                type: object
                required: [pipe_id, event_kind, challenge]
                properties:
                  pipe_id: {type: string}
                  event_kind: {type: string, enum: [claimed, read]}
                  challenge:
                    $ref: "#/components/schemas/FederatedPipeReceiptChallenge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /v1/pipe/receipts/batch:
    put:
      operationId: pipeReceiptRecordBatch
      summary: Record up to 40 independently signed exact receipt-v2 events.
      description: >-
        Transport aggregation only: every item carries its own nonce-bound
        signature over the exact single-event receipt path and challenge body,
        so peers verify the same proof as the non-batch route. Items are
        processed in request order; a failed claimed event suppresses the
        matching read event, while unrelated items retain independent partial
        success. Exact replay is idempotent.
      tags: [Pipeline]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 40
                  items:
                    type: object
                    required: [pipe_id, kind, proof]
                    properties:
                      pipe_id: {type: string, minLength: 1}
                      kind: {type: string, enum: [claimed, read]}
                      proof:
                        type: object
                        required: [agent_id, signature, timestamp, nonce, canonical_request]
                        properties:
                          agent_id: {type: string}
                          signature: {type: string, format: byte}
                          timestamp: {type: integer, format: int64}
                          nonce: {type: string, format: byte}
                          canonical_request: {type: string, format: byte}
      responses:
        "200":
          description: Per-event durable queue/rejection outcomes in request order.
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  count: {type: integer, minimum: 1, maximum: 40}
                  items:
                    type: array
                    minItems: 1
                    maxItems: 40
                    items:
                      type: object
                      required: [pipe_id, event_kind, receipt_status]
                      properties:
                        pipe_id: {type: string}
                        event_kind: {type: string, enum: [claimed, read]}
                        receipt_status: {type: string, enum: [queued, unconfirmed]}
                        idempotent_replay: {type: boolean}
                        error: {type: string, enum: [invalid_receipt_proof, duplicate_receipt_event, claim_not_confirmed, rejected]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  /v1/pipe/{pipe_id}/receipt/{kind}:
    put:
      operationId: pipeReceiptRecord
      summary: Sign and queue exact-recipient claim/read evidence.
      description: >-
        Submit the challenge body unchanged with a fresh nonce-bound signature
        from the exact recipient. Claim/read and receipt outbox insertion are
        atomic. `queued` is local durable receipt transport state, not yet
        sender-visible confirmation.
      tags: [Pipeline]
      parameters:
        - name: pipe_id
          in: path
          required: true
          schema: {type: string}
        - name: kind
          in: path
          required: true
          schema: {type: string, enum: [claimed, read]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FederatedPipeReceiptChallenge"
      responses:
        "200":
          description: Exact transition and receipt outbox entry persisted or replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederatedPipeReceiptActionResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  /v1/pipe/{pipe_id}/receipt:
    get:
      operationId: pipeReceiptStatus
      summary: Read payload-free federated receipt evidence as the exact sender.
      description: >-
        Unrelated callers, recipients, operators, Admin, Root, and absent IDs
        share the same generic 404 behavior. Peer durable admission is distinct
        from exact-recipient signed claim/read evidence. A v1 or historical
        ungeneration-bound row is explicitly unsupported/unconfirmed.
      tags: [Pipeline]
      parameters:
        - name: pipe_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exact sender-only, payload-free independent receipt dimensions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederatedPipeReceiptStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/pipe/{pipe_id}/claim:
    put:
      operationId: pipeClaim
      summary: Atomically claim a pipeline message (prevents double-processing).
      tags:
        - Pipeline
      parameters:
        - name: pipe_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Message claimed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pipe_id:
                    type: string
                  status:
                    type: string
                    example: claimed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/pipe/{pipe_id}/result:
    put:
      operationId: pipeResult
      summary: Submit a result for a claimed local or federated message.
      description: >-
        Local completion inserts an `observation` memory in domain
        `agent-pipeline`. Federated work remains transient and queues a signed
        result over the original return route without auto-journaling.
      tags:
        - Pipeline
      parameters:
        - name: pipe_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipeResultRequest"
      responses:
        "200":
          description: Result submitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: completed
                  journal_id:
                    type: string
                    description: memory_id of the auto-journal entry, or empty string.
                  journaled:
                    type: boolean
                    description: False for federated work; local completion may create a summary journal.
                  reply_event_id:
                    type: string
                    description: Durable signed return event for federated work.
                  idempotent_replay:
                    type: boolean
                    description: True when an identical retry recovered the original durable reply event.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  # -- OAuth (root-level, no /v1/ prefix) ----------------------------------
  /.well-known/oauth-authorization-server:
    get:
      operationId: oauthDiscovery
      summary: RFC 8414 OAuth 2.0 Authorization Server Metadata.
      description: Discovery document for ChatGPT MCP connector compatibility.
      tags:
        - OAuth
      security: []
      responses:
        "200":
          description: Authorization server metadata document.
          content:
            application/json:
              schema:
                type: object

  /.well-known/oauth-protected-resource:
    get:
      operationId: oauthProtectedResource
      summary: RFC 9728 Protected Resource Metadata.
      tags:
        - OAuth
      security: []
      responses:
        "200":
          description: Protected resource metadata document.
          content:
            application/json:
              schema:
                type: object

  /oauth/register:
    post:
      operationId: oauthClientRegister
      summary: RFC 7591 Dynamic Client Registration (10 reqs/IP/hour).
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Client registered.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Rate limit exceeded.

  /oauth/authorize:
    get:
      operationId: oauthAuthorizeGet
      summary: Render PKCE consent screen.
      tags:
        - OAuth
      security: []
      parameters:
        - name: response_type
          in: query
          schema:
            type: string
        - name: client_id
          in: query
          schema:
            type: string
        - name: redirect_uri
          in: query
          schema:
            type: string
        - name: code_challenge
          in: query
          schema:
            type: string
        - name: code_challenge_method
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Consent screen HTML.
          content:
            text/html:
              schema:
                type: string
    post:
      operationId: oauthAuthorizePost
      summary: Submit consent; mints bearer + issues auth code; redirects to redirect_uri.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        "302":
          description: Redirect to redirect_uri with authorization code.

  /oauth/token:
    post:
      operationId: oauthToken
      summary: Exchange auth code for bearer (grant_type=authorization_code only).
      description: >-
        The access_token returned is accepted as Authorization: Bearer <token>
        on /v1/mcp/sse and /v1/mcp/streamable. Token lifetime is controlled by
        revocation (DELETE /v1/mcp/tokens/{id}), not expiry — expires_in=0.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                code:
                  type: string
                redirect_uri:
                  type: string
                client_id:
                  type: string
                code_verifier:
                  type: string
      responses:
        "200":
          description: Token response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 0
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/federation/available:
    get:
      operationId: getCallerFederationAvailability
      summary: Discover bounded caller-authorized federation domains and recipients.
      description: >-
        Signed active-ordinary caller projection. Each call performs one
        bounded caller-authorized page inside a public scan horizon. agent_name
        performs targeted lookup with agent_limit 1-20. peer_cursor is the
        short-lived signed-caller/query-bound continuation returned by an
        incomplete page; it contains no peer ID or hidden agreement count.
        read_candidate_domains are local/peer policy intersections only;
        shared_read_domains additionally passed a live destination check using
        the same linked-reader and access-group gates as recall. Callers must
        inspect read_authorization and must not present candidates as readable
        unless verification completed. Results are authorization metadata, not
        presence or delivery evidence.
        Distinct lookups consume fixed per-caller and process-wide outbound-call
        budgets; 429 includes Retry-After. Exact saved recipient addresses do
        not require discovery, and clients must not auto-walk every page.
      tags: [Federation]
      parameters:
        - in: query
          name: agent_name
          schema: {type: string, maxLength: 512}
        - in: query
          name: agent_limit
          schema: {type: integer, minimum: 1, maximum: 20, default: 20}
        - in: query
          name: peer_cursor
          description: Continuation returned by the preceding exact signed lookup.
          schema: {type: string, maxLength: 128}
      responses:
        "200":
          description: Bounded caller-filtered connections.
          content:
            application/json:
              schema:
                type: object
                required: [connections, total, complete, message]
                properties:
                  connections: {type: array, maxItems: 24, items: {type: object}}
                  total: {type: integer, minimum: 0, maximum: 24}
                  complete: {type: boolean}
                  next_peer_cursor: {type: string}
                  message: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429":
          description: Caller or process outbound discovery budget exhausted; retry after Retry-After.
          content: {application/problem+json: {schema: {$ref: "#/components/schemas/ProblemDetails"}}}

  /v1/federation/recall-plan:
    post:
      operationId: createFederatedRecallPlan
      summary: Create the destination-bound signing plan for a federated recall.
      description: >-
        First half of the app-v23 two-request recall protocol. The caller must
        copy destinations to the second recall's federate_chains and copy
        source_chain_id, agreement_bindings, query_challenges,
        authorization_models, and authorization_attestations verbatim into its
        signed federation_context. A peer that cannot complete current planning
        is reported in errors and omitted from destinations. A second request
        that omits authorization map entries is an old-client error and must be
        re-planned and re-signed; an empty model plus explicit zero attestation
        remains a valid legacy-peer tuple.
      tags: [Federation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain_tag]
              properties:
                domain_tag: {type: string, minLength: 1, maxLength: 256}
                federate_chains:
                  type: array
                  maxItems: 8
                  items: {type: string, minLength: 1}
      responses:
        "200":
          description: Exact finite destination plan and complete signing tuple.
          content:
            application/json:
              schema:
                type: object
                required: [protocol_version, source_chain_id, destinations, agreement_bindings, query_challenges, authorization_models, authorization_attestations, expires_at]
                properties:
                  protocol_version: {type: integer, const: 23}
                  source_chain_id: {type: string, minLength: 1}
                  destinations: {type: array, maxItems: 8, items: {type: string}}
                  agreement_bindings: {type: object, additionalProperties: {type: string}}
                  query_challenges: {type: object, additionalProperties: {type: string}}
                  authorization_models: {type: object, additionalProperties: {type: string}}
                  authorization_attestations:
                    type: object
                    additionalProperties:
                      type: object
                      required: [eligible, max_classification]
                      properties:
                        eligible: {type: boolean}
                        max_classification: {type: integer, minimum: 0, maximum: 4}
                  expires_at: {type: object, additionalProperties: {type: integer, format: int64}}
                  errors: {type: object, additionalProperties: {type: string}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "502":
          description: Planning failed before a valid per-peer result could be returned.
          content: {application/problem+json: {schema: {$ref: "#/components/schemas/ProblemDetails"}}}

  /v1/federation/contacts/authorize:
    post:
      operationId: authorizeCachedFederatedContacts
      summary: Revalidate cached federated contact scopes against current local policy.
      description: >-
        Local-only signed policy check used by MCP before reusing its short-lived
        contact cache. It performs no peer request and returns only the subset
        still authorized for this exact caller.
      tags: [Federation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contacts]
              properties:
                contacts:
                  type: array
                  maxItems: 512
                  items:
                    type: object
                    required: [remote_chain_id, domain]
                    properties:
                      remote_chain_id: {type: string}
                      domain: {type: string, minLength: 1, maxLength: 256}
      responses:
        "200":
          description: Currently authorized contact scopes.
          content:
            application/json:
              schema:
                type: object
                required: [allowed_contacts]
                properties:
                  allowed_contacts:
                    type: array
                    maxItems: 512
                    items:
                      type: object
                      required: [remote_chain_id, domain]
                      properties:
                        remote_chain_id: {type: string}
                        domain: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  # -- Operational ---------------------------------------------------------
  /health:
    get:
      operationId: healthCheck
      summary: Liveness probe.
      tags:
        - Operational
      security: []
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      operationId: readinessCheck
      summary: Readiness probe — checks storage, CometBFT, and scoped projection integrity.
      tags:
        - Operational
      security: []
      responses:
        "200":
          description: Service is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
