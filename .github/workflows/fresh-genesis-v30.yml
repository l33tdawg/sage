name: Fresh app-v30 quorum

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-proofs:
    name: App30 canonical replay and crash proofs (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            uname: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            uname: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Prove canonical bytes, composed block, committed replay and process-crash recovery
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WANT_GOARCH: ${{ matrix.arch }}
          WANT_UNAME: ${{ matrix.uname }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          test "$(uname -m)" = "$WANT_UNAME"
          test "$(go env GOARCH)" = "$WANT_GOARCH"
          mkdir -p output/fresh-v30-core-proof
          git rev-parse HEAD | tee output/fresh-v30-core-proof/checkout.txt
          uname -m | tee output/fresh-v30-core-proof/uname.txt
          go env GOARCH | tee output/fresh-v30-core-proof/goarch.txt
          python3 deploy/scripts/v11.9-source-id.py | tee output/fresh-v30-core-proof/source-id.txt
          proof_tests='^(TestAppV30CanonicalStateAppHashGolden|TestAppV30ComposedBlockCommitReopenAndReplay|TestAppV30CommittedReplayBoundary|TestAppV30SIGKILLProjectionAndTaintRecovery|TestAppV30ScopeReservationBoundsActualApplyClearAndRelease|TestAppV30ScopeReservationBoundsVotedGovernanceAndPendingCarry|TestAppV30GovernanceExecutionKeepsReservationThroughApply|TestAppV30GovernancePartialApplyRollsBackReservation|TestMemoryTaintCursorStaysSpeculativeUntilCommit|TestAppV30MeteredSubmitRestoresCacheAfterLateRejection|TestAppV30MeteredWorkPreservesFatalPartialMutation|TestAppV30NodeLocalEvidenceAndJudgmentsDoNotChangeCommittedAppHash|TestAppV30SameBlockRootRotationPreservesSubmittedProvenance)$'
          go test -mod=readonly -race -tags=v119testfixture ./internal/abci -list "$proof_tests" | tee output/fresh-v30-core-proof/test-inventory.txt
          for proof_test in TestAppV30CanonicalStateAppHashGolden TestAppV30ComposedBlockCommitReopenAndReplay TestAppV30CommittedReplayBoundary TestAppV30SIGKILLProjectionAndTaintRecovery TestAppV30ScopeReservationBoundsActualApplyClearAndRelease TestAppV30ScopeReservationBoundsVotedGovernanceAndPendingCarry TestAppV30GovernanceExecutionKeepsReservationThroughApply TestAppV30GovernancePartialApplyRollsBackReservation TestMemoryTaintCursorStaysSpeculativeUntilCommit TestAppV30MeteredSubmitRestoresCacheAfterLateRejection TestAppV30MeteredWorkPreservesFatalPartialMutation TestAppV30NodeLocalEvidenceAndJudgmentsDoNotChangeCommittedAppHash TestAppV30SameBlockRootRotationPreservesSubmittedProvenance; do
            grep -F -x -q -- "$proof_test" output/fresh-v30-core-proof/test-inventory.txt
          done
          go test -mod=readonly -race -tags=v119testfixture ./internal/abci -run "$proof_tests" -count=1 -timeout=8m -json | tee output/fresh-v30-core-proof/run.jsonl
          python3 deploy/scripts/assert-go-test-json.py output/fresh-v30-core-proof/run.jsonl github.com/l33tdawg/sage/internal/abci TestAppV30CanonicalStateAppHashGolden TestAppV30ComposedBlockCommitReopenAndReplay TestAppV30CommittedReplayBoundary TestAppV30SIGKILLProjectionAndTaintRecovery TestAppV30ScopeReservationBoundsActualApplyClearAndRelease TestAppV30ScopeReservationBoundsVotedGovernanceAndPendingCarry TestAppV30GovernanceExecutionKeepsReservationThroughApply TestAppV30GovernancePartialApplyRollsBackReservation TestMemoryTaintCursorStaysSpeculativeUntilCommit TestAppV30MeteredSubmitRestoresCacheAfterLateRejection TestAppV30MeteredWorkPreservesFatalPartialMutation TestAppV30NodeLocalEvidenceAndJudgmentsDoNotChangeCommittedAppHash TestAppV30SameBlockRootRotationPreservesSubmittedProvenance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fresh-app-v30-core-proof-${{ matrix.arch }}
          path: output/fresh-v30-core-proof
          if-no-files-found: error
  network-state-sync:
    name: Fresh app30 authorized network state sync
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Assert frozen source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Transfer nonempty fresh app30 state to pristine non-validator receivers
        env:
          V119_STATE_SYNC_MODE: fresh-v30
          V119_STATE_SYNC_REBUILD: '1'
          V119_STATE_SYNC_TIMEOUT: '300'
          V119_STATE_SYNC_EVIDENCE_DIR: output/fresh-v30-sync
        run: |
          mkdir -p output/fresh-v30-sync
          set -o pipefail
          bash deploy/scripts/run-v11.9-state-sync.sh 2>&1 | tee output/fresh-v30-sync/run.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fresh-app-v30-network-state-sync-evidence
          path: output/fresh-v30-sync
          if-no-files-found: error
  mixed-quorum:
    name: Fresh app30 mixed quorum, Direct taint, and restart (QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Assert frozen source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - name: Run fresh signed app-v30 genesis on two validators of each architecture
        env:
          DET_PROJECT: sage-fresh-v30
          DET_FRESH_V30: '1'
          DET_MIXED_ARCH: '1'
          DET_REBUILD: '1'
          DET_BLOCK_TIME: 300ms
          DET_TIMEOUT: 1200s
          DET_TEST: '^TestAppV30FreshGenesisFourValidators$'
        run: |
          mkdir -p output/fresh-v30
          set -o pipefail
          bash deploy/scripts/run-determinism.sh 2>&1 | tee output/fresh-v30/run.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fresh-app-v30-quorum-evidence
          path: |
            output/fresh-v30/*.log
            output/fresh-v30/*.jsonl
          if-no-files-found: error
