name: Website Checks

on:
  pull_request:
    branches: [gh-pages]
  push:
    branches: [gh-pages]

permissions:
  contents: read

jobs:
  website-checks:
    name: Website Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Run website tests
        run: node --test tests/*.mjs
      - name: Verify offline capture integrity
        run: node tools/verify-captures.mjs
