name: v12 native app-daemon transport

on:
  pull_request:
    branches: [v12-beta, codex/v12-stable-convergence, codex/v12-native-daemon-qualification, codex/v12-native-session-lifecycle]
    paths:
      - "desktop/SAGECerebrumNative/**"
      - "api/**"
      - "cmd/sage-gui/**"
      - "internal/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "scripts/v12-native-transport-qualification.*"
      - "scripts/v12-native-session-qualification.*"
      - "scripts/fixtures/NativeTransportProbe.swift"
      - "scripts/fixtures/NativeSessionProbe.swift"
      - "scripts/build-native-cerebrum-macos.sh"
      - ".github/workflows/v12-native-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v12-native-transport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-security:
    name: Native identity and bootstrap authorization
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify native identity and bootstrap authorization
        run: |
          mkdir -p dist/v12-native/bootstrap-validation
          set -o pipefail
          # After 745 top-level web tests passed, the full race suite exhausted
          # 20 minutes while still populating a SQLite fixture. Preserve every
          # test with a 30-minute package budget and separate compile headroom.
          CGO_ENABLED=1 go test -timeout 30m -race -json ./internal/nativeidentity ./internal/nativebootstrap ./internal/shellcontrol ./web > dist/v12-native/bootstrap-validation/go-security.jsonl
          CGO_ENABLED=0 go test ./internal/nativeidentity
          go vet ./internal/nativeidentity ./internal/nativebootstrap ./internal/shellcontrol
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sage-v12-native-security-${{ github.sha }}
          path: dist/v12-native/bootstrap-validation/
          if-no-files-found: error
          retention-days: 14

  # Qualification consumes no security-job output; both remain independent gates.
  qualify:
    name: Real Swift transport, encrypted AppSession and governed app-v28 beta daemon
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      SAGE_NATIVE_VERSION: 12.0.0-beta.1
      SAGE_NATIVE_CONFIGURATION: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify pinned Swift toolchain
        run: |
          test -d "${DEVELOPER_DIR}"
          xcodebuild -version
          swift --version
      - name: Exercise shipping transport over real sockets and URLSession
        run: bash scripts/v12-native-transport-qualification.sh
      - name: Exercise production AppSession login, lock and daemon restart
        run: bash scripts/v12-native-session-qualification.sh
      - name: Verify native contract unit tests
        run: swift test --package-path desktop/SAGECerebrumNative --disable-sandbox --filter 'NativeCredentialLifecycleQualification|NativeBootstrapQualification|AppSessionLifecycle|ShellControlQualification|APIBaseURLRejects|shellControlRequires|SSEFrames|overviewPayloads|nativeCommandsAreAvailableOnlyForAReadySession|focusSearchIsReadyGatedAndConsumedExactlyOnce'
      - name: Build the release native application
        run: bash scripts/build-native-cerebrum-macos.sh
      - name: Verify release transport and linkage
        run: |
          EXECUTABLE="dist/v12-native/${SAGE_NATIVE_VERSION}/SAGE CEREBRUM Native.app/Contents/MacOS/SAGECerebrumNative"
          test -x "${EXECUTABLE}"
          otool -L "${EXECUTABLE}" > dist/v12-native/transport-validation/linked-frameworks.txt
          if otool -L "${EXECUTABLE}" | grep -E 'WebKit|JavaScriptCore'; then exit 1; fi
          if strings "${EXECUTABLE}" | grep -E 'NativeSessionProbe|NativeTransportProbe|SAGE_API_URL|NativeAXAcceptanceFixture|NativeAppSceneAcceptanceFixture|Sec-Fetch-Site|SAGE_LEGACY_TRANSPORT_QUALIFICATION'; then exit 1; fi
          /usr/bin/shasum -a 256 "${EXECUTABLE}" > dist/v12-native/transport-validation/native-release.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sage-v12-native-transport-${{ github.sha }}
          path: |
            dist/v12-native/transport-validation/
            dist/v12-native/session-validation/
          if-no-files-found: error
          retention-days: 14
